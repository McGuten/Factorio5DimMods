[mod-setting-description]
5d-space-age-materials=Когда включено и установлено DLC Space Age, прогрессия высоких уровней (5–10) потребует как планетарных материалов в рецептах, так и планетарных пакетов науки в технологиях, следуя прогрессии Space Age каждого модуля.
5d-icon-tier-overlay=Добавляет значок с номером уровня на иконки предметов, рецептов, технологий и прототипов, использующих общий помощник значков 5Dim.
5d-icon-tier-overlay-black-background=Показывает значок уровня иконки с текущим чёрным фоном. Отключите, чтобы оставить только номер уровня.
5d-entity-tier-overlay=Отображает номер уровня над поддерживаемыми размещёнными объектами во время игры.
5d-entity-tier-overlay-black-background=Показывает наложение уровня объекта с чёрным фоном за номером. Отключите, чтобы оставить только номер уровня.
5d-machine-work-factor=Глобальный фактор прогрессии между уровнями для рабочей производительности машин, такой как скорость производства, скорость добычи, скорость исследований, скорость перекачки или аналогичные показатели пропускной способности. Стартовая настройка. По умолчанию: 1.45
5d-machine-energy-factor=Глобальный фактор прогрессии между уровнями для энергопотребления машин. Более высокие значения делают поздние уровни более энергоёмкими для поддержки масштабирования мегабаз. Стартовая настройка. По умолчанию: 1.75
5d-machine-recipe-factor=Глобальный фактор прогрессии между уровнями для дельт рецептов улучшения машин. Внутренние веса редкости не дают экзотическим ингредиентам масштабироваться так же сильно, как обычным конструкционным материалам. Стартовая настройка. По умолчанию: 1.25
5d-machine-tech-factor=Глобальный фактор прогрессии между уровнями для стоимости исследований технологий машин. Стоимость исследований округляется до более ровных значений. Стартовая настройка. По умолчанию: 1.3
5d-machine-t10-next-tier-work=Когда включено, последний уровень поддерживаемых семейств машин использует рабочее значение следующего теоретического уровня, превращая T10 в итоговое улучшение без повышения его базового энергетического уровня. Стартовая настройка.
5d-machine-t10-extra-module-slots=Дополнительные слоты модулей, добавляемые на последний уровень поддерживаемых семейств машин как итоговый бонус. Стартовая настройка. По умолчанию: 2
5d-crafting-time-multiplier=Множитель для всего времени производства (по умолчанию: 1.0)
5d-recipe-cost-multiplier=Глобальный множитель стоимости ингредиентов рецептов. Применяется к устаревшему масштабированию ингредиентов и количествам материалов Space Age. Семейства машин, использующие поуровневую прогрессию рецептов, вместо этого управляются множителем прогрессии рецептов машин. Стартовая настройка. (по умолчанию: 1.0)
5d-spoil-time-multiplier=Множитель, применяемый ко времени порчи всех скоропортящихся предметов. Значения выше 1 продлевают срок хранения; значения ниже 1 ускоряют порчу. Виден только при установленном Space Age. (по умолчанию: 1.0)
5d-change-inventory=Количество слотов инвентаря игрока (по умолчанию: 60)
5d-change-stack=Множитель размеров стопок предметов
5d-long-reach=Дальность для строительства и открытия инвентарей. Для взаимодействия со всем экраном: 125 (по умолчанию: 6)
5d-long-mine=Увеличивает дальность добычи вашего игрока (по умолчанию: 6)
5d-mining-speed=Множитель скорости добычи игрока
5d-light-radius=Радиус света вокруг игрока (по умолчанию: 25)
5d-ores=Делает все залежи ресурсов бесконечными
5d-yield=Бесконечные руды с полной отдачей (минимум 100 %)
5d-tree=Уменьшает зону столкновения деревьев для удобства перемещения
5d-item-start=Выберите стартовые предметы при создании новой карты
5d-equip-start=Выберите стартовое снаряжение при создании новой карты
5d-train-tech=Открыть технологии поездов в начале игры
5d-robot-tech=Открыть технологии дронов в начале игры
5d-hp=Максимальное количество очков здоровья игрока (по умолчанию: 250)
5d-healing=Восстановление здоровья за тик (по умолчанию: 0.15)
5d-stack-artillery-bullets=Разрешить артиллерийским снарядам складываться в стопки до 5
5d-special-turrets=Включает ядовитые, кислотные, миномётные, дроно-раскладывающие и сигнальные турели вместе с их рецептами и технологиями.
5d-special-mines=Включает ядовитые и кислотные мины вместе с их рецептами и технологиями.
5d-bicho-spawner-hp=Множитель здоровья ульев врагов
5d-bicho-hp=Множитель здоровья юнитов врагов
5d-bicho-healing=Множитель лечения врагов за тик
5d-suicide=Включает кусак-смертников, взрывающихся при контакте
5d-exp=Включает экспериментальные типы врагов
5d-worm=Включает чудовищных и экспериментальных червей
5d-storage=Включает бесконечное исследование размера груза дронов
5d-stack=Включает бесконечное исследование ёмкости стекового манипулятора
5d-speed=Включает бесконечное исследование бонуса к скорости исследований
5d-speed-gun-turret=Включает бесконечное исследование скорости оружия и турелей
5d-braking=Включает бесконечное исследование силы торможения поездов
5d-grid=Включает сетки экипировки на технике
5d-grid-override=Переопределяет сетки экипировки на всей технике (требует включённых сеток техники)
