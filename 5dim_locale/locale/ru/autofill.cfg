[mod-setting-name]
folk-fill-fuel-stack-size=Размер стопки топлива (%)
folk-fill-ammo-stack-size=Размер стопки боеприпасов (%)
5d-autofill-robots=Автозаполнение объектов, построенных дронами

[mod-setting-description]
folk-fill-ammo-stack-size=Процент от размера стопки для загрузки в инвентари боеприпасов.\n\nПримечание: это процент от стандартного размера стопки. Значение 100 загрузит полную стопку, значение 25 — четверть стопки.\n\nМинимум: 5 % / Максимум 100 %
folk-fill-fuel-stack-size=Процент от размера стопки для загрузки в инвентари топлива.\n\nПримечание: это процент от стандартного размера стопки. Значение 100 загрузит полную стопку, значение 25 — четверть стопки.\n\nМинимум: 5 % / Максимум 100 %
5d-autofill-robots=Когда включено, турели и техника, размещённые строительными дронами, также автоматически заполняются, беря боеприпасы и топливо из логистической сети дрона. По умолчанию отключено, так как это сильнее ручного поведения на основе инвентаря игрока.
