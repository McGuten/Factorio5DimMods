[mod-setting-description]
5d-space-age-integration=Cuando está activado y el DLC Space Age está instalado, los items de alto nivel (5-10) requerirán materiales de diferentes planetas (Vulcanus, Fulgora, Aquilo) y las tecnologías requerirán packs de ciencia planetarios.
5d-machine-work-factor=Factor global de progresión entre tiers para el trabajo de las máquinas, como velocidad de fabricación, velocidad de minería, velocidad de investigación, velocidad de bombeo o estadísticas similares de rendimiento. Ajuste de inicio. Por defecto: 1.45
5d-machine-energy-factor=Factor global de progresión entre tiers para el consumo de energía de las máquinas. Valores más altos hacen que los tiers avanzados exijan más infraestructura eléctrica para escalar megabases. Ajuste de inicio. Por defecto: 1.75
5d-machine-recipe-factor=Factor global de progresión entre tiers para los deltas de receta al mejorar máquinas. Los pesos internos por rareza evitan que los ingredientes exóticos escalen tan fuerte como los materiales estructurales comunes. Ajuste de inicio. Por defecto: 1.25
5d-machine-tech-factor=Factor global de progresión entre tiers para los costes de investigación de tecnologías de máquinas. Los costes se redondean a valores más limpios. Ajuste de inicio. Por defecto: 1.3
5d-machine-t10-next-tier-work=Cuando está activado, el tier final de las familias de máquinas compatibles usa el valor de trabajo del siguiente tier teórico, convirtiendo el T10 en una mejora capstone sin subir su tier base de energía. Ajuste de inicio.
5d-machine-t10-extra-module-slots=Ranuras de módulos extra añadidas al tier final de las familias de máquinas compatibles como bonus capstone. Ajuste de inicio. Por defecto: 2
5d-crafting-time-multiplier=Multiplicador para todos los tiempos de fabricación (Por defecto: 1.0)
5d-change-inventory=Número de ranuras de inventario para el jugador (Por defecto: 60)
5d-change-stack=Multiplicador para el tamaño de los stacks de items

