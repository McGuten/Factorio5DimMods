[enemy-info-description]
normal=Balanced baseline enemy with vanilla-style pacing and no extreme modifiers.
laser=Resists laser-heavy defenses and keeps pressure on energy-based setups.
physical=Armored strain tuned to absorb bullets and other physical damage.
impact=Slow bruiser that trades speed for harder hits and heavier impact damage.
railgun=Fast ranged specialist with armor-piercing pressure and Space Age flavor.
fire=Area-denial attacker that leaves flames and punishes static defenses.
rocket=Long-range explosive attacker that punishes clustered walls and turrets.
suicide=Close-range kamikaze variant that detonates on contact for burst damage.
poison=Attrition-focused attacker that spreads poison and lingering damage.
electric=Shock attacker that mixes damage with electric disruption pressure.
broodmother=Spawner-like strain that overwhelms defenses by releasing offspring.
swarm=Tiny, fast and numerous attackers that trade durability for numbers.
regenerator=Sustained-pressure enemy that rapidly recovers lost health.
berserker=Glass-cannon attacker with aggressive damage and lower staying power.
tank=Extreme durability enemy with heavy resistances but lower offensive pressure.
acid=Corrosive worm strain focused on stronger acid-based area denial.
explosion=Blast-heavy worm strain tuned to punish concentrated defenses.

[tips-and-tricks-item-description]
5dim-enemies-tiers=Enemies in 5Dim's now spawn in 10 tiers (MK1-MK10) plus powerful boss variants.\n\n[font=default-bold]Tier Progression:[/font]\n• Tiers scale with evolution factor\n• Higher tiers have more health, damage, and resistances\n• 3 tiers are active at any evolution level\n• Each type has different evolution ranges\n\n[font=default-bold]Boss Enemies:[/font]\n• Appear at high evolution (90%+)\n• 2x health and damage multiplier\n• 2x scale (visually larger)\n• Slower but much more dangerous

5dim-enemies-bosses=[color=#6600CC]Boss enemies[/color] are massive, powerful variants of each enemy type.\n\n[font=default-bold]Boss Multipliers:[/font]\n• 2x Health\n• 2x Damage\n• 2x Scale (visually larger)\n• 40% slower movement\n\n[font=default-bold]Spawn Conditions:[/font]\n• Begin appearing at 90% evolution\n• Maximum spawn rate at 100% evolution\n• All enemy types have boss variants\n\n[font=default-bold]Strategy:[/font]\nBosses require concentrated firepower. Artillery, rockets, and focused turret fire are essential. They're slow, use that to your advantage!