tank=강력한 저항을 갖췄지만 공격 압박은 낮은 극도의 내구성 적.
acid=더 강력한 산성 지역 봉쇄에 특화된 부식성 땅벌레 변종.
explosion=밀집된 방어를 응징하도록 조정된 폭발 중심의 땅벌레 변종.

