[mod-setting-name]
folk-fill-fuel-stack-size=Treibstoff-Stapelgröße (%)
folk-fill-ammo-stack-size=Munitions-Stapelgröße (%)
5d-autofill-robots=Von Robotern gebaute Entitäten automatisch befüllen

[mod-setting-description]
folk-fill-ammo-stack-size=Prozentsatz der Stapelgröße, der in Munitionsinventare eingefüllt wird.\n\nHinweis: Dies ist ein Prozentsatz der Standard-Stapelgröße. Bei 100 wird ein voller Stapel eingefüllt, bei 25 ein Viertel eines Stapels.\n\nMinimum: 5 % / Maximum 100 %
folk-fill-fuel-stack-size=Prozentsatz der Stapelgröße, der in Treibstoffinventare eingefüllt wird.\n\nHinweis: Dies ist ein Prozentsatz der Standard-Stapelgröße. Bei 100 wird ein voller Stapel eingefüllt, bei 25 ein Viertel eines Stapels.\n\nMinimum: 5 % / Maximum 100 %
5d-autofill-robots=Wenn aktiviert, werden auch von Baurobotern platzierte Geschütztürme und Fahrzeuge automatisch befüllt und beziehen Munition und Treibstoff aus dem Logistiknetzwerk des Roboters. Standardmäßig deaktiviert, da es stärker ist als das manuelle Verhalten auf Basis des Spielerinventars.
