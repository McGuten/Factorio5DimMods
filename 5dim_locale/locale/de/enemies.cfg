swarm=Winzige, schnelle und zahlreiche Angreifer, die Haltbarkeit gegen Anzahl eintauschen.
regenerator=Gegner mit anhaltendem Druck, der schnell verlorenes Leben zurückgewinnt.
berserker=Glaskanone als Angreifer mit aggressivem Schaden und geringerer Durchhaltefähigkeit.
tank=Gegner mit extremer Haltbarkeit, starken Resistenzen, aber geringerem Offensivdruck.
acid=Korrosiver Wurmstamm, der auf stärkere säurebasierte Flächenkontrolle ausgerichtet ist.
explosion=Explosionsstarker Wurmstamm, der darauf ausgelegt ist, konzentrierte Verteidigungen zu bestrafen.

