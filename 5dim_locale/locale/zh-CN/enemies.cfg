[tips-and-tricks-item-description]
5dim-enemies-intro=5Dim 的敌人对敌人系统进行了全面改造，加入了专门的敌人类型、10 阶进阶系统和首领敌人。\n\n每种敌人类型都有独特的特性、抗性和行为，需要不同的策略才能击败。了解每种类型以相应地布置你的防御。

5dim-enemies-tiers=5Dim 中的敌人现在分为 10 个阶级（MK1-MK10），外加强大的首领变种。\n\n[font=default-bold]阶级进阶：[/font]\n• 阶级随进化度提升\n• 阶级越高，血量、伤害和抗性越高\n• 任何进化度下都有 3 个阶级处于活跃状态\n• 每种类型的进化度范围不同\n\n[font=default-bold]首领敌人：[/font]\n• 在高进化度（90%+）下出现\n• 血量和伤害 2 倍\n• 体型 2 倍（视觉上更大）\n• 移动更慢但危险得多

5dim-enemies-full-battle=观看所有敌人类型协同发动联合突袭，对抗坚固的防御！\n\n[font=default-bold]本场战斗中的敌人：[/font]\n• 普通、激光、物理、冲击撕咬虫\n• 虫母（死亡时生成幼体）\n• 虫群撕咬虫（大量小型快速敌人）\n• 再生与狂暴撕咬虫\n• 火焰、火箭、剧毒、电击喷吐虫\n\n[font=default-bold]防御布局：[/font]\n• 机枪炮塔（前线）\n• 激光炮塔（高伤害）\n• 火焰炮塔（范围伤害）\n• 石墙（保护）

5dim-enemies-normal-biter=类似原版敌人的标准撕咬虫。\n\n[font=default-bold]特性：[/font]\n• 没有特殊抗性\n• 各阶级属性平衡\n• 在进化度 0% 到 80% 之间出现\n\n[font=default-bold]策略：[/font]\n任何武器类型都有效。适合测试防御布局。

5dim-enemies-laser-biter=[color=#4444FF]蓝色撕咬虫[/color]，激光抗性高。\n\n[font=default-bold]特性：[/font]\n• 85%+ 激光伤害抗性\n• 正常物理易伤\n• 在进化度 10% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n使用机枪炮塔、火焰喷射器或重炮。激光炮塔对它们几乎无效。

5dim-enemies-physical-biter=[color=#AAAAAA]灰/银色装甲撕咬虫[/color]，子弹抗性高。\n\n[font=default-bold]特性：[/font]\n• 85%+ 物理伤害抗性\n• 高减伤（固定降低伤害）\n• 在进化度 10% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n使用激光炮塔、火焰喷射器或爆炸物。机枪炮塔伤害极小。

5dim-enemies-impact-biter=[color=#8B4513]深棕色重型撕咬虫[/color]，造成冲击伤害。\n\n[font=default-bold]特性：[/font]\n• 血量比普通多 30%\n• 伤害多 50%\n• 移动速度慢 15%\n• 抗冲击伤害\n• 在进化度 10% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n它们较慢，所以风筝战术有效。用远程武器在它们到达墙壁前削减数量。

5dim-enemies-broodmother-biter=[color=#FF00FF]品红/粉色撕咬虫[/color]，被击杀时生成幼体。\n\n[font=default-bold]特性：[/font]\n• 血量多 50%（耐打）\n• 移动速度慢 30%\n• 伤害少 20%\n• [color=red]死亡时：50% 几率生成一只更低阶的撕咬虫[/color]\n• 在进化度 25% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n尽可能用高伤害武器一击击杀。范围武器可以处理生成的幼体。火焰喷射器非常出色，因为它同时伤害虫母及其幼体。

5dim-enemies-swarm-biter=[color=#FFD700]金/棕褐色小型撕咬虫[/color]，成群大量攻击。\n\n[font=default-bold]特性：[/font]\n• 血量减少 75%（非常脆弱）\n• 伤害减少 50%\n• 移动速度快 50%\n• 体型为正常的 70%（更小）\n• [color=cyan]巢穴以 2 倍速度生成 2 倍数量的单位[/color]\n• 在进化度 10% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n范围武器在此大放异彩。火焰喷射器、火箭和手雷可以清除整个虫群。单体武器会被淹没。

5dim-enemies-regenerator-biter=[color=#00FF00]亮黄绿色撕咬虫[/color]，回血极快。\n\n[font=default-bold]特性：[/font]\n• 血量减少 25%\n• [color=cyan]回血速度快 5 倍[/color]\n• [color=red]惧火（抗性 -25%）[/color]\n• 在进化度 20% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n集中火力快速击杀，或用火焰伤害利用其弱点。若让它们撤退，几乎会立即满血归来。

5dim-enemies-berserker-biter=[color=#CC0000]血红色撕咬虫[/color]，是玻璃大炮。\n\n[font=default-bold]特性：[/font]\n• 血量减少 50%\n• [color=red]2 倍伤害（非常危险！）[/color]\n• 移动速度快 30%\n• [color=cyan]完全无法回血[/color]\n• 额外承受 10% 物理伤害\n• 在进化度 25% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n在它们到达你的墙壁前击杀！高爆发伤害必不可少。它们造成毁灭性伤害但很快死亡。墙壁对减缓它们至关重要。

5dim-enemies-tank=[color=#808000]军绿色敌人[/color]，对所有伤害类型抗性相同。\n\n[font=default-bold]可用：[/font]\n• 坦克撕咬虫\n• 坦克喷吐虫\n• 坦克沙虫\n\n[font=default-bold]特性：[/font]\n• [color=cyan]对所有伤害类型 50% 抗性[/color]（物理、激光、火焰、剧毒、电击、爆炸、酸液、冲击）\n• [color=cyan]2 倍血量[/color]（极其耐打）\n• [color=red]伤害减少 65%[/color]\n• 移动速度慢 20%\n• 没有固定减伤，仅百分比\n• 在进化度 15% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n没有任何单一武器类型对它们特别有效或无力。使用你 DPS 最高的武器。它们伤害低，并非立即的威胁，但会在更危险的敌人逼近时牵制你的防御。

5dim-enemies-fire-spitter=[color=#FF6600]橙/火色喷吐虫[/color]，发射火焰弹。\n\n[font=default-bold]特性：[/font]\n• 血量比普通喷吐虫少 25%\n• 命中时造成持续火焰伤害\n• 形成燃烧地面\n• 在进化度 20% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n它们的弹丸会点燃你的基地。在炮塔周围使用石头或混凝土路面。抗火装备有助于个人防御。

5dim-enemies-rocket-spitter=[color=#FFFF66]淡黄色喷吐虫[/color]，发射爆炸火箭。\n\n[font=default-bold]特性：[/font]\n• 血量比普通喷吐虫少 25%\n• 爆炸溅射伤害\n• 命中时造成范围伤害\n• 在进化度 30% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n分散你的防御以减少溅射伤害。墙壁有助于吸收火箭命中。狙击的优先目标。

5dim-enemies-suicide-spitter=[color=#9900CC]深紫色喷吐虫[/color]，死亡时爆炸。\n\n[font=default-bold]特性：[/font]\n• 血量减少 50%\n• 移动速度快 50%\n• [color=red]爆炸伤害 5 倍！[/color]\n• 在进化度 30% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n在它们到达你的基地前于远处击杀。它们的爆炸会摧毁炮塔和墙壁。绝不要让它们靠近关键基础设施。

5dim-enemies-poison-spitter=[color=#006600]深绿色喷吐虫[/color]，造成毒素伤害。\n\n[font=default-bold]特性：[/font]\n• 持续毒素伤害\n• 可叠加的毒素效果\n• 在进化度 20% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n毒素会随时间消耗你的建筑。维修包和机器人必不可少。个人护盾有助于抵抗毒素伤害。

5dim-enemies-electric-spitter=[color=#00FFFF]亮青色喷吐虫[/color]，造成连锁闪电伤害。\n\n[font=default-bold]特性：[/font]\n• 电力/闪电伤害\n• 可在附近目标间跳跃\n• 在进化度 30% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n拉开炮塔间距以防止连锁伤害。孤立的防御阵地比密集集群更有效。

5dim-enemies-railgun=[color=#008080]来自太空时代的青色敌人[/color]，具有磁轨抗性。\n\n[font=default-bold]可用：[/font]\n• 磁轨撕咬虫\n• 磁轨喷吐虫\n• 磁轨沙虫\n\n[font=default-bold]特性：[/font]\n• 对磁轨/穿甲伤害有高抗性\n• 在进化度 20% 到 100% 之间出现\n\n[font=default-bold]策略：[/font]\n使用常规武器。磁轨炮和穿甲弹效果较差。

5dim-enemies-bosses=[color=#6600CC]首领敌人[/color]是每种敌人类型的巨大强力变种。\n\n[font=default-bold]首领倍率：[/font]\n• 血量 2 倍\n• 伤害 2 倍\n• 体型 2 倍（视觉上更大）\n• 移动速度慢 40%\n\n[font=default-bold]出现条件：[/font]\n• 在 90% 进化度开始出现\n• 在 100% 进化度达到最大出现率\n• 所有敌人类型都有首领变种\n\n[font=default-bold]策略：[/font]\n首领需要集中火力。重炮、火箭和集中的炮塔火力必不可少。它们移动缓慢，善加利用！

