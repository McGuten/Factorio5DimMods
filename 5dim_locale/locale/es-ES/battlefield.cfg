5d-sniper-rifle=Rifle de largo alcance que usa cargadores de francotirador específicos.
5d-sniper-magazine=Munición básica de francotirador ajustada para el rifle de francotirador y las torretas de francotirador.
5d-piercing-sniper-magazine=Munición de francotirador perforante para un mejor daño sostenido.
5d-tungsten-sniper-magazine=Munición de francotirador de núcleo denso de tungsteno que se sitúa entre el poder de detención perforante y el de uranio.
5d-uranium-sniper-magazine=Munición de francotirador de alta gama con balas de uranio para el máximo impacto.
5d-uranium-tungsten-sniper-magazine=Munición de francotirador de final de partida que refuerza las balas de uranio con tungsteno para los golpes más duros del repertorio.
5d-tungsten-rifle-magazine=Munición de rifle de núcleo denso de tungsteno que se sitúa entre el poder de detención perforante y el de uranio.
5d-uranium-tungsten-rifle-magazine=Munición de rifle de final de partida que refuerza las balas de uranio con tungsteno para los golpes más duros del repertorio.
5d-tungsten-shotgun-shell=Cartuchos de escopeta cargados con tungsteno denso que se sitúan entre el poder de detención perforante y el de uranio.
5d-uranium-shotgun-shell=Cartuchos de escopeta de alta gama cargados con perdigones de uranio para el máximo impacto.
5d-uranium-tungsten-shotgun-shell=Cartuchos de escopeta de final de partida que refuerzan los perdigones de uranio con tungsteno para los golpes más duros del repertorio.
5d-poison-rounds=Munición especializada que causa daño de veneno y crea una nube de veneno al impactar.
