[mod-setting-name]
folk-fill-fuel-stack-size=燃料堆叠数量（%）
folk-fill-ammo-stack-size=弹药堆叠数量（%）
5d-autofill-robots=自动填充机器人建造的实体

[mod-setting-description]
folk-fill-ammo-stack-size=插入弹药栏的堆叠数量百分比。\n\n注意：这是默认堆叠数量的百分比。设为 100 将插入一整组，设为 25 将插入 1/4 组。\n\n最小值：5% / 最大值 100%
folk-fill-fuel-stack-size=插入燃料栏的堆叠数量百分比。\n\n注意：这是默认堆叠数量的百分比。设为 100 将插入一整组，设为 25 将插入 1/4 组。\n\n最小值：5% / 最大值 100%
5d-autofill-robots=启用时，由建设机器人放置的炮塔和载具也会自动填充，从机器人的物流网络获取弹药和燃料。默认禁用，因为它比基于玩家物品栏的手动行为更强。
