fire=区域封锁型攻击者，会留下火焰并惩罚静态防御。
rocket=远程爆炸型攻击者，惩罚密集的墙壁和炮塔。
suicide=近距离自杀式变种，接触即引爆造成爆发伤害。
poison=以消耗为主的攻击者，会扩散毒素和持续伤害。
electric=电击型攻击者，将伤害与电力扰乱压力结合。
broodmother=类似巢穴的变种，通过释放幼体压垮防御。
swarm=微小、快速且数量众多的攻击者，以耐久换取数量。
regenerator=持续施压的敌人，能快速恢复失去的血量。
berserker=玻璃大炮型攻击者，伤害凶猛但续航较低。
tank=极高耐久的敌人，抗性很高但进攻压力较低。
acid=专注于更强酸液区域封锁的腐蚀沙虫变种。
explosion=高爆型沙虫变种，专门惩罚集中的防御。

