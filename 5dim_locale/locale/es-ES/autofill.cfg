[mod-setting-name]
folk-fill-fuel-stack-size=Tamaño de stack de combustible (%)
folk-fill-ammo-stack-size=Tamaño de stack de munición (%)
5d-autofill-robots=Autorrellenar entidades construidas por robots

[mod-setting-description]
folk-fill-ammo-stack-size=Porcentaje del tamaño de stack que insertar en los inventarios de munición.\n\nNota: Esto es un porcentaje del tamaño de stack por defecto. Ponerlo a 100 insertará un stack completo, ponerlo a 25 insertará 1/4 de un stack.\n\nMínimo: 5 % / Máximo 100 %
folk-fill-fuel-stack-size=Porcentaje del tamaño de stack que insertar en los inventarios de combustible.\n\nNota: Esto es un porcentaje del tamaño de stack por defecto. Ponerlo a 100 insertará un stack completo, ponerlo a 25 insertará 1/4 de un stack.\n\nMínimo: 5 % / Máximo 100 %
5d-autofill-robots=Cuando está activado, las torretas y vehículos colocados por robots de construcción también se autorrellenan, tomando munición y combustible de la red logística del robot. Desactivado por defecto porque es más potente que el comportamiento manual basado en el inventario del jugador.
