[mod-setting-description]
5d-laser-biter=启用抗激光伤害的撕咬虫
5d-physical-biter=启用抗物理伤害的撕咬虫
5d-impact-biter=启用抗冲击/爆炸伤害的撕咬虫
5d-railgun-biter=启用抗物理伤害并带有磁轨攻击的撕咬虫（需要 Space Age）
5d-fire-spitter=启用喷射火流的喷吐虫
5d-rocket-spitter=启用发射火箭的喷吐虫
5d-suicide=启用接触即爆炸的喷吐虫
5d-laser-spitter=启用发射激光束的喷吐虫
5d-physical-spitter=启用投掷岩石/碎片的喷吐虫
5d-poison-spitter=启用产生毒云的喷吐虫
5d-electric-spitter=启用带有放电攻击的喷吐虫
5d-broodmother-biter=启用死亡时生成幼体的撕咬虫
5d-broodmother-spitter=启用死亡时生成幼体的喷吐虫
5d-swarm-biter=启用大量成群攻击的微小快速撕咬虫
5d-regenerator-biter=启用极快回复血量的撕咬虫
5d-regenerator-spitter=启用极快回复血量的喷吐虫
5d-berserker-biter=启用高伤害低血量的激进撕咬虫
5d-tank-biter=启用对所有伤害类型有 50% 抗性但伤害低的超高耐久撕咬虫
5d-tank-spitter=启用对所有伤害类型有 50% 抗性但伤害低的超高耐久喷吐虫
5d-tank-worm=启用对所有伤害类型有 50% 抗性但伤害低的超高耐久沙虫
5d-railgun-spitter=启用发射磁轨光束的喷吐虫（需要 Space Age）
5d-worm=启用巨兽型与首领级沙虫
5d-railgun-worm=启用发射磁轨光束的沙虫（需要 Space Age）
5d-boss=启用在极高进化度下出现的首领（11 阶）敌人
5d-death-effects=为元素型敌人（火焰、剧毒、电击等）启用特殊死亡效果
5d-death-effect-scale=死亡效果的缩放（0.25 = 更小，3.0 = 大得多）
5d-typed-damage=为敌人攻击启用类型化伤害（火焰撕咬虫造成火焰伤害等）
5d-attack-stickers=在敌人攻击中启用附着效果（火焰导致燃烧，剧毒导致减速）
5d-health-multiplier=敌人血量的倍率（越高 = 敌人越强韧）
5d-damage-multiplier=敌人伤害的倍率（越高 = 攻击越危险）
5d-speed-multiplier=敌人移动速度的倍率（越高 = 敌人越快）

