physical=Gepanzerter Stamm, der darauf ausgelegt ist, Kugeln und anderen physischen Schaden zu absorbieren.
impact=Langsamer Schläger, der Geschwindigkeit gegen härtere Treffer und höheren Aufprallschaden eintauscht.
railgun=Schneller Fernkampfspezialist mit panzerbrechendem Druck und Space-Age-Flair.
fire=Flächenkontroll-Angreifer, der Flammen hinterlässt und statische Verteidigungen bestraft.
rocket=Explosiver Fernkampf-Angreifer, der gebündelte Mauern und Geschütztürme bestraft.
