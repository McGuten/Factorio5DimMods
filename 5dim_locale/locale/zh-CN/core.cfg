[mod-setting-description]
5d-space-age-materials=启用且安装了 Space Age DLC 时，高阶进阶（5-10）的配方将需要行星材料、科技将需要行星科技包，遵循每个模组的太空时代进阶。
5d-icon-tier-overlay=在使用 5Dim 共享徽章系统的物品、配方、科技和原型图标上添加阶级数字徽章。
5d-icon-tier-overlay-black-background=以当前黑色背景显示图标阶级徽章。禁用它则仅保留阶级数字。
5d-entity-tier-overlay=在游戏运行时在支持的已放置实体上方绘制阶级数字。
5d-entity-tier-overlay-black-background=在数字后方以黑色背景显示实体阶级覆盖层。禁用它则仅保留阶级数字。
5d-machine-work-factor=机器工作输出（如制造速度、采矿速度、研究速度、抽取速度或类似吞吐属性）的阶级间全局进阶系数。启动设置。默认值：1.45
5d-machine-energy-factor=机器能耗的阶级间全局进阶系数。数值越高，后期阶级越耗电，以支持超级基地的扩展。启动设置。默认值：1.75
5d-machine-recipe-factor=机器升级配方增量的阶级间全局进阶系数。内部稀有度权重可避免稀有原料像常见结构材料那样大幅缩放。启动设置。默认值：1.25
5d-machine-tech-factor=机器科技研究数量的阶级间全局进阶系数。研究数量会取整为更整洁的数值。启动设置。默认值：1.3
5d-machine-t10-next-tier-work=启用时，支持的机器系列的最终阶级使用下一理论阶级的工作数值，使 T10 成为顶级升级，而不提升其基础能耗阶级。启动设置。
5d-machine-t10-extra-module-slots=作为顶级奖励，为支持的机器系列的最终阶级添加额外插件槽位。启动设置。默认值：2
5d-crafting-time-multiplier=所有制造时间的倍率（默认值：1.0）
5d-recipe-cost-multiplier=配方原料成本的全局倍率。适用于传统原料缩放和太空时代材料数量。使用按阶级配方进阶的机器系列改由"机器配方进阶系数"控制。启动设置。（默认值：1.0）
5d-spoil-time-multiplier=应用于所有易腐物品变质时间的倍率。大于 1 使物品保存更久；小于 1 使其更快变质。仅在安装 Space Age 时可见。（默认值：1.0）
5d-change-inventory=玩家物品栏的槽位数量（默认值：60）
5d-change-stack=物品堆叠数量的倍率
5d-long-reach=建造和打开容器的距离。若要与整个屏幕交互：125（默认值：6）
5d-long-mine=扩展玩家的采集距离（默认值：6）
5d-mining-speed=玩家采矿速度的倍率
5d-light-radius=玩家周围光照的半径（默认值：25）
5d-ores=使所有资源矿藏无限
5d-yield=全产量无限矿物（最低 100%）
5d-tree=缩小树木碰撞箱以便于通行
5d-item-start=创建新地图时选择初始物品
5d-equip-start=创建新地图时选择初始装备
5d-train-tech=游戏开始时解锁火车科技
5d-robot-tech=游戏开始时解锁机器人科技
5d-hp=玩家的最大生命值（默认值：250）
5d-healing=每刻血量回复（默认值：0.15）
5d-stack-artillery-bullets=允许重炮炮弹堆叠至 5
5d-special-turrets=启用剧毒、酸液、迫击炮、机器人部署和照明弹炮塔及其配方和科技。
5d-special-mines=启用剧毒和酸液地雷及其配方和科技。
5d-bicho-spawner-hp=敌人巢穴血量的倍率
5d-bicho-hp=敌人单位血量的倍率
5d-bicho-healing=敌人每刻回复量的倍率
5d-suicide=启用接触即爆炸的自爆撕咬虫
5d-exp=启用实验性敌人类型
5d-worm=启用巨兽型与实验性沙虫
5d-storage=启用机器人载货量的无限研究
5d-stack=启用集装机械臂容量的无限研究
5d-speed=启用研究速度加成的无限研究
5d-speed-gun-turret=启用枪械与炮塔射速的无限研究
5d-braking=启用火车制动力的无限研究
5d-grid=在载具上启用装备网格
5d-grid-override=覆盖所有载具的装备网格（需要启用载具网格）
