[tips-and-tricks-item-description]
5dim-enemies-intro=Enemigos de 5Dim añade una renovación completa del sistema de enemigos con tipos de enemigo especializados, un sistema de progresión de 10 tiers y enemigos jefe.\n\nCada tipo de enemigo tiene características, resistencias y comportamientos únicos que requieren estrategias diferentes para derrotarlos. Aprende sobre cada tipo para preparar tus defensas en consecuencia.

5dim-enemies-tiers=Los enemigos de 5Dim ahora aparecen en 10 tiers (MK1-MK10) más potentes variantes jefe.\n\n[font=default-bold]Progresión de tiers:[/font]\n• Los tiers escalan con el factor de evolución\n• Los tiers superiores tienen más salud, daño y resistencias\n• 3 tiers están activos en cualquier nivel de evolución\n• Cada tipo tiene rangos de evolución diferentes\n\n[font=default-bold]Enemigos jefe:[/font]\n• Aparecen con una evolución alta (90 %+)\n• Multiplicador de 2x en salud y daño\n• 2x de escala (visualmente más grandes)\n• Más lentos pero mucho más peligrosos

5dim-enemies-full-battle=¡Observa todos los tipos de enemigos trabajando juntos en un asalto combinado contra una defensa fortificada!\n\n[font=default-bold]Enemigos en esta batalla:[/font]\n• Mordedores normales, láser, físicos y de impacto\n• Matriarca (genera crías al morir)\n• Mordedores de enjambre (muchos enemigos pequeños y rápidos)\n• Mordedores regeneradores y berserker\n• Escupidores de fuego, cohete, veneno y eléctricos\n\n[font=default-bold]Configuración defensiva:[/font]\n• Torretas ametralladoras (primera línea)\n• Torretas láser (mucho daño)\n• Torreta lanzallamas (daño de área)\n• Muros de piedra (protección)

5dim-enemies-normal-biter=Mordedores estándar similares a los enemigos vanilla.\n\n[font=default-bold]Características:[/font]\n• Sin resistencias especiales\n• Estadísticas equilibradas en todos los tiers\n• Aparecen del 0 % al 80 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nCualquier tipo de arma es eficaz. Buenos para probar configuraciones defensivas.

5dim-enemies-laser-biter=[color=#4444FF]Mordedores de color azul[/color] con alta resistencia al láser.\n\n[font=default-bold]Características:[/font]\n• 85 %+ de resistencia al daño láser\n• Vulnerabilidad física normal\n• Aparecen del 10 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nUsa torretas ametralladoras, lanzallamas o artillería. Las torretas láser son casi inútiles contra ellos.

5dim-enemies-physical-biter=[color=#AAAAAA]Mordedores acorazados gris/plata[/color] con alta resistencia a las balas.\n\n[font=default-bold]Características:[/font]\n• 85 %+ de resistencia al daño físico\n• Alta reducción de daño (reduce el daño de forma plana)\n• Aparecen del 10 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nUsa torretas láser, lanzallamas o explosivos. Las torretas ametralladoras hacen un daño mínimo.

5dim-enemies-impact-biter=[color=#8B4513]Mordedores pesados marrón oscuro[/color] que causan daño de impacto.\n\n[font=default-bold]Características:[/font]\n• 30 % más de salud que lo normal\n• 50 % más de daño\n• 15 % más lentos\n• Resistentes al daño de impacto\n• Aparecen del 10 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nSon más lentos, así que el kiting es eficaz. Usa armas de largo alcance para reducir su número antes de que lleguen a tus muros.

5dim-enemies-broodmother-biter=[color=#FF00FF]Mordedores magenta/rosa[/color] que generan crías al ser eliminados.\n\n[font=default-bold]Características:[/font]\n• 50 % más de salud (resistentes)\n• 30 % más lentos\n• 20 % menos de daño\n• [color=red]Al morir: 50 % de probabilidad de generar un mordedor de tier inferior[/color]\n• Aparecen del 25 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nUsa armas de mucho daño para eliminarlos de un golpe cuando sea posible. Las armas de área pueden encargarse de las crías generadas. Los lanzallamas son excelentes, ya que dañan tanto a la matriarca como a sus crías.

5dim-enemies-swarm-biter=[color=#FFD700]Mordedores pequeños dorados/canela[/color] que atacan en gran número.\n\n[font=default-bold]Características:[/font]\n• 75 % menos de salud (muy frágiles)\n• 50 % menos de daño\n• 50 % más rápidos\n• 70 % de la escala normal (más pequeños)\n• [color=cyan]Los nidos producen 2x unidades al doble de velocidad[/color]\n• Aparecen del 10 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nLas armas de área brillan aquí. Los lanzallamas, cohetes y granadas pueden aniquilar enjambres enteros. Las armas de objetivo único se verán desbordadas.

5dim-enemies-regenerator-biter=[color=#00FF00]Mordedores verde lima brillante[/color] que se curan extremadamente rápido.\n\n[font=default-bold]Características:[/font]\n• 25 % menos de salud\n• [color=cyan]Ritmo de curación 5x más rápido[/color]\n• [color=red]Débiles al fuego (-25 % de resistencia)[/color]\n• Aparecen del 20 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nConcentra el fuego para matarlos rápido, o usa daño de fuego para explotar su debilidad. Si les dejas retirarse, volverán con toda la salud casi al instante.

5dim-enemies-berserker-biter=[color=#CC0000]Mordedores rojo sangre[/color] que son de cristal.\n\n[font=default-bold]Características:[/font]\n• 50 % menos de salud\n• [color=red]2x de daño (¡muy peligrosos!)[/color]\n• 30 % más rápidos\n• [color=cyan]No pueden curarse en absoluto[/color]\n• Reciben un 10 % de daño físico extra\n• Aparecen del 25 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\n¡Mátalos antes de que lleguen a tus muros! Un alto daño en ráfaga es esencial. Causan un daño devastador pero mueren rápido. Los muros son cruciales para frenarlos.

5dim-enemies-tank=[color=#808000]Enemigos verde oliva militar[/color] que resisten todos los tipos de daño por igual.\n\n[font=default-bold]Disponibles:[/font]\n• Mordedores tanque\n• Escupidores tanque\n• Gusanos tanque\n\n[font=default-bold]Características:[/font]\n• [color=cyan]50 % de resistencia a TODOS los tipos de daño[/color] (físico, láser, fuego, veneno, eléctrico, explosión, ácido, impacto)\n• [color=cyan]2x de salud[/color] (extremadamente resistentes)\n• [color=red]65 % menos de daño[/color]\n• 20 % más lentos\n• Sin reducción de daño plana, solo porcentaje\n• Aparecen del 15 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nNingún tipo de arma es especialmente eficaz o débil contra ellos. Usa tus armas con mayor DPS. Su bajo daño significa que no son una amenaza inmediata, pero pueden distraer tus defensas mientras se acercan enemigos más peligrosos.

5dim-enemies-fire-spitter=[color=#FF6600]Escupidores naranja/de fuego[/color] que disparan proyectiles de fuego.\n\n[font=default-bold]Características:[/font]\n• 25 % menos de salud que los escupidores normales\n• Daño de fuego a lo largo del tiempo al impactar\n• Crean suelo en llamas\n• Aparecen del 20 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nSus proyectiles pueden incendiar tu base. Usa caminos de piedra u hormigón alrededor de las torretas. El equipamiento resistente al fuego ayuda para la defensa personal.

5dim-enemies-rocket-spitter=[color=#FFFF66]Escupidores amarillo pálido[/color] que disparan cohetes explosivos.\n\n[font=default-bold]Características:[/font]\n• 25 % menos de salud que los escupidores normales\n• Daño de salpicadura explosivo\n• Daño de área al impactar\n• Aparecen del 30 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nReparte tus defensas para minimizar el daño de salpicadura. Los muros ayudan a absorber los impactos de cohete. Objetivos prioritarios para francotirador.

5dim-enemies-suicide-spitter=[color=#9900CC]Escupidores morado oscuro[/color] que explotan al morir.\n\n[font=default-bold]Características:[/font]\n• 50 % menos de salud\n• 50 % más rápidos\n• [color=red]¡5x de daño al explotar![/color]\n• Aparecen del 30 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nMátalos a distancia antes de que lleguen a tu base. Sus explosiones pueden destruir torretas y muros. Nunca dejes que se acerquen a la infraestructura crítica.

5dim-enemies-poison-spitter=[color=#006600]Escupidores verde oscuro[/color] que aplican daño de veneno.\n\n[font=default-bold]Características:[/font]\n• Daño de veneno a lo largo del tiempo\n• Efecto de veneno acumulable\n• Aparecen del 20 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nEl veneno puede desgastar tus estructuras con el tiempo. Los kits de reparación y los robots son esenciales. Los escudos personales ayudan contra el daño de veneno.

5dim-enemies-electric-spitter=[color=#00FFFF]Escupidores cian brillante[/color] que causan daño de rayo en cadena.\n\n[font=default-bold]Características:[/font]\n• Daño eléctrico/de rayo\n• Pueden saltar entre objetivos cercanos\n• Aparecen del 30 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nSepara tus torretas para evitar el daño en cadena. Las posiciones defensivas aisladas son más eficaces que los grupos densos.

5dim-enemies-railgun=[color=#008080]Enemigos turquesa[/color] de Space Age con resistencia al railgun.\n\n[font=default-bold]Disponibles:[/font]\n• Mordedores railgun\n• Escupidores railgun\n• Gusanos railgun\n\n[font=default-bold]Características:[/font]\n• Alta resistencia al daño de railgun/perforante\n• Aparecen del 20 % al 100 % de evolución\n\n[font=default-bold]Estrategia:[/font]\nUsa armas convencionales. Los railguns y la munición perforante son menos eficaces.

5dim-enemies-bosses=[color=#6600CC]Los enemigos jefe[/color] son variantes enormes y poderosas de cada tipo de enemigo.\n\n[font=default-bold]Multiplicadores de jefe:[/font]\n• 2x de salud\n• 2x de daño\n• 2x de escala (visualmente más grandes)\n• 40 % más lentos\n\n[font=default-bold]Condiciones de aparición:[/font]\n• Empiezan a aparecer al 90 % de evolución\n• Tasa máxima de aparición al 100 % de evolución\n• Todos los tipos de enemigo tienen variantes jefe\n\n[font=default-bold]Estrategia:[/font]\nLos jefes requieren potencia de fuego concentrada. La artillería, los cohetes y el fuego de torretas concentrado son esenciales. Son lentos, ¡aprovéchalo!

