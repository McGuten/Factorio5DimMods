[mod-setting-name]
folk-fill-fuel-stack-size=연료 더미 크기 (%)
folk-fill-ammo-stack-size=탄약 더미 크기 (%)
5d-autofill-robots=로봇이 건설한 개체 자동 채우기

[mod-setting-description]
folk-fill-ammo-stack-size=탄약 인벤토리에 넣을 더미 크기의 백분율.\n\n참고: 이것은 기본 더미 크기의 백분율입니다. 100으로 설정하면 전체 더미를, 25로 설정하면 더미의 1/4을 넣습니다.\n\n최소: 5% / 최대 100%
folk-fill-fuel-stack-size=연료 인벤토리에 넣을 더미 크기의 백분율.\n\n참고: 이것은 기본 더미 크기의 백분율입니다. 100으로 설정하면 전체 더미를, 25로 설정하면 더미의 1/4을 넣습니다.\n\n최소: 5% / 최대 100%
5d-autofill-robots=활성화하면, 건설 로봇이 설치한 포탑과 차량도 자동으로 채워지며, 로봇의 물류 네트워크에서 탄약과 연료를 가져옵니다. 플레이어 인벤토리 기반의 수동 동작보다 강력하기 때문에 기본적으로 비활성화되어 있습니다.
