[mod-setting-description]
5d-laser-biter=Activa mordedores resistentes al daño láser
5d-physical-biter=Activa mordedores resistentes al daño físico
5d-impact-biter=Activa mordedores resistentes al daño de impacto/explosión
5d-railgun-biter=Activa mordedores resistentes al daño físico con ataques de railgun (requiere Space Age)
5d-fire-spitter=Activa escupidores que disparan chorros de fuego
5d-rocket-spitter=Activa escupidores que disparan cohetes
5d-suicide=Activa escupidores que explotan al contacto
5d-laser-spitter=Activa escupidores que disparan haces láser
5d-physical-spitter=Activa escupidores que lanzan rocas/escombros
5d-poison-spitter=Activa escupidores que crean nubes de veneno
5d-electric-spitter=Activa escupidores con ataques de descarga eléctrica
5d-broodmother-biter=Activa mordedores que generan crías al morir
5d-broodmother-spitter=Activa escupidores que generan crías al morir
5d-swarm-biter=Activa mordedores diminutos y rápidos que atacan en gran número
5d-regenerator-biter=Activa mordedores que regeneran salud extremadamente rápido
5d-regenerator-spitter=Activa escupidores que regeneran salud extremadamente rápido
5d-berserker-biter=Activa mordedores agresivos con mucho daño pero poca salud
5d-tank-biter=Activa mordedores extremadamente resistentes con un 50 % de resistencia a todos los tipos de daño pero poco daño
5d-tank-spitter=Activa escupidores extremadamente resistentes con un 50 % de resistencia a todos los tipos de daño pero poco daño
5d-tank-worm=Activa gusanos extremadamente resistentes con un 50 % de resistencia a todos los tipos de daño pero poco daño
5d-railgun-spitter=Activa escupidores que disparan haces de railgun (requiere Space Age)
5d-worm=Activa los gusanos de tier mastodonte y jefe
5d-railgun-worm=Activa gusanos que disparan haces de railgun (requiere Space Age)
5d-boss=Activa los enemigos jefe (tier 11) que aparecen con una evolución muy alta
5d-death-effects=Activa efectos de muerte especiales para los enemigos elementales (fuego, veneno, eléctrico, etc.)
5d-death-effect-scale=Escala de los efectos de muerte (0.25 = más pequeños, 3.0 = mucho más grandes)
5d-typed-damage=Activa el daño tipado para los ataques enemigos (los mordedores de fuego causan daño de fuego, etc.)
5d-attack-stickers=Activa los adhesivos en los ataques enemigos (el fuego causa quemaduras, el veneno causa ralentización)
5d-health-multiplier=Multiplicador para la salud de los enemigos (mayor = enemigos más resistentes)
5d-damage-multiplier=Multiplicador para el daño de los enemigos (mayor = ataques más peligrosos)
5d-speed-multiplier=Multiplicador para la velocidad de movimiento de los enemigos (mayor = enemigos más rápidos)

