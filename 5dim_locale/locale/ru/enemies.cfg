laser=Сопротивляется обороне с упором на лазеры и сохраняет давление на энергетические построения.
physical=Бронированная разновидность, настроенная на поглощение пуль и другого физического урона.
impact=Медлительный громила, меняющий скорость на более сильные удары и больший урон от удара.
railgun=Быстрый дальнобойный специалист с бронебойным давлением и колоритом Space Age.
fire=Атакующий контроля территории, который оставляет пламя и наказывает статичную оборону.
rocket=Дальнобойный взрывной атакующий, наказывающий скученные стены и турели.
suicide=Ближнебойный камикадзе-вариант, детонирующий при контакте для взрывного урона.
poison=Атакующий на истощение, который распространяет яд и длительный урон.
electric=Шоковый атакующий, сочетающий урон с давлением электрических помех.
broodmother=Разновидность, подобная улью, которая подавляет оборону, выпуская потомство.
swarm=Крошечные, быстрые и многочисленные атакующие, меняющие живучесть на численность.
regenerator=Враг постоянного давления, быстро восстанавливающий потерянное здоровье.
berserker=Хрупкий, но мощный атакующий с агрессивным уроном и меньшей живучестью.
tank=Враг с крайней живучестью, мощными сопротивлениями, но меньшим наступательным давлением.
acid=Едкая разновидность червя, нацеленная на более мощный кислотный контроль территории.
explosion=Взрывоопасная разновидность червя, настроенная на наказание сосредоточенной обороны.

