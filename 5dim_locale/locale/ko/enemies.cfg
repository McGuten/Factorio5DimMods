[tips-and-tricks-item-description]
5dim-enemies-intro=5Dim의 적은 특화된 적 유형, 10등급 진행 시스템, 보스 적을 더해 적 시스템을 완전히 개편합니다.\n\n각 적 유형은 고유한 특성, 저항, 행동을 가지며 물리치려면 서로 다른 전략이 필요합니다. 각 유형을 익혀 그에 맞게 방어를 준비하세요.

5dim-enemies-tiers=5Dim의 적은 이제 10등급(MK1–MK10)과 강력한 보스 변종으로 출현합니다.\n\n[font=default-bold]등급 진행:[/font]\n• 등급은 진화 계수에 따라 확장됩니다\n• 높은 등급일수록 체력, 피해, 저항이 더 높습니다\n• 어떤 진화 수준에서도 3개 등급이 활성화됩니다\n• 각 유형은 서로 다른 진화 범위를 가집니다\n\n[font=default-bold]보스 적:[/font]\n• 높은 진화(90%+)에서 나타납니다\n• 체력 및 피해 배수 2배\n• 크기 2배 (시각적으로 더 큼)\n• 느리지만 훨씬 더 위험함

5dim-enemies-full-battle=모든 적 유형이 요새화된 방어에 맞서 합동 공격으로 함께 싸우는 모습을 지켜보세요!\n\n[font=default-bold]이 전투의 적:[/font]\n• 일반, 레이저, 물리, 충격 바이터\n• 번식체 (사망 시 새끼 생성)\n• 군집 바이터 (작고 빠른 다수의 적)\n• 재생 및 광폭 바이터\n• 화염, 로켓, 독, 전기 스피터\n\n[font=default-bold]방어 구성:[/font]\n• 기관 포탑 (전선)\n• 레이저 포탑 (높은 피해)\n• 화염 방사 포탑 (광역 피해)\n• 벽 (보호)

5dim-enemies-normal-biter=바닐라 적과 유사한 표준 바이터.\n\n[font=default-bold]특성:[/font]\n• 특수 저항 없음\n• 모든 등급에서 균형 잡힌 능력치\n• 진화 0%~80%에서 출현\n\n[font=default-bold]전략:[/font]\n어떤 무기 유형이든 효과적입니다. 방어 구성을 테스트하기에 좋습니다.

5dim-enemies-laser-biter=[color=#4444FF]파란색 바이터[/color], 높은 레이저 저항이 있습니다.\n\n[font=default-bold]특성:[/font]\n• 레이저 피해 85%+ 저항\n• 일반 물리 취약성\n• 진화 10%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n기관 포탑, 화염방사기, 대포를 사용하세요. 레이저 포탑은 이들에게 거의 쓸모없습니다.

5dim-enemies-physical-biter=[color=#AAAAAA]회색/은색 장갑 바이터[/color], 높은 총탄 저항이 있습니다.\n\n[font=default-bold]특성:[/font]\n• 물리 피해 85%+ 저항\n• 높은 피해 감소 (피해를 고정량 감소)\n• 진화 10%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n레이저 포탑, 화염방사기, 폭발물을 사용하세요. 기관 포탑은 최소한의 피해만 줍니다.

5dim-enemies-impact-biter=[color=#8B4513]짙은 갈색 중장 바이터[/color], 충격 피해를 줍니다.\n\n[font=default-bold]특성:[/font]\n• 일반보다 체력 30% 증가\n• 피해 50% 증가\n• 이동 속도 15% 감소\n• 충격 피해에 저항\n• 진화 10%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n느리므로 카이팅이 효과적입니다. 장거리 무기를 사용해 벽에 도달하기 전에 수를 줄이세요.

5dim-enemies-broodmother-biter=[color=#FF00FF]자홍색/분홍색 바이터[/color], 처치되면 새끼를 생성합니다.\n\n[font=default-bold]특성:[/font]\n• 체력 50% 증가 (단단함)\n• 이동 속도 30% 감소\n• 피해 20% 감소\n• [color=red]사망 시: 50% 확률로 하위 등급 바이터 생성[/color]\n• 진화 25%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n가능하면 높은 피해 무기로 단번에 처치하세요. 광역 무기는 생성된 새끼를 처리할 수 있습니다. 화염방사기는 번식체와 그 새끼 모두에게 피해를 주므로 훌륭합니다.

5dim-enemies-swarm-biter=[color=#FFD700]작은 금색/황갈색 바이터[/color], 많은 수로 공격합니다.\n\n[font=default-bold]특성:[/font]\n• 체력 75% 감소 (매우 약함)\n• 피해 50% 감소\n• 이동 속도 50% 증가\n• 일반 크기의 70% (더 작음)\n• [color=cyan]산란장이 2배 속도로 2배 유닛 생산[/color]\n• 진화 10%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n광역 무기가 여기서 빛납니다. 화염방사기, 로켓, 수류탄으로 무리 전체를 쓸어버릴 수 있습니다. 단일 대상 무기는 압도당합니다.

5dim-enemies-regenerator-biter=[color=#00FF00]밝은 라임색 바이터[/color], 극도로 빠르게 치유합니다.\n\n[font=default-bold]특성:[/font]\n• 체력 25% 감소\n• [color=cyan]치유 속도 5배[/color]\n• [color=red]화염에 취약 (-25% 저항)[/color]\n• 진화 20%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n집중 사격으로 빠르게 처치하거나, 화염 피해로 약점을 노리세요. 후퇴하게 두면 거의 즉시 완전한 체력으로 돌아옵니다.

5dim-enemies-berserker-biter=[color=#CC0000]핏빛 빨간색 바이터[/color], 유리 대포입니다.\n\n[font=default-bold]특성:[/font]\n• 체력 50% 감소\n• [color=red]피해 2배 (매우 위험!)[/color]\n• 이동 속도 30% 증가\n• [color=cyan]전혀 치유할 수 없음[/color]\n• 물리 피해를 10% 추가로 받음\n• 진화 25%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n벽에 도달하기 전에 처치하세요! 높은 폭딜이 필수적입니다. 치명적인 피해를 주지만 빠르게 죽습니다. 벽이 이들을 늦추는 데 매우 중요합니다.

5dim-enemies-tank=[color=#808000]군용 올리브색 적[/color], 모든 피해 유형에 똑같이 저항합니다.\n\n[font=default-bold]사용 가능:[/font]\n• 탱크 바이터\n• 탱크 스피터\n• 탱크 땅벌레\n\n[font=default-bold]특성:[/font]\n• [color=cyan]모든 피해 유형에 50% 저항[/color] (물리, 레이저, 화염, 독, 전기, 폭발, 산성, 충격)\n• [color=cyan]체력 2배[/color] (극도로 단단함)\n• [color=red]피해 65% 감소[/color]\n• 이동 속도 20% 감소\n• 고정 피해 감소 없음, 비율만 적용\n• 진화 15%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n어떤 단일 무기 유형도 특별히 효과적이거나 약하지 않습니다. 가장 높은 DPS 무기를 사용하세요. 낮은 피해 덕분에 즉각적인 위협은 아니지만, 더 위험한 적이 다가오는 동안 방어를 분산시킬 수 있습니다.

5dim-enemies-fire-spitter=[color=#FF6600]주황색/화염 스피터[/color], 화염 발사체를 쏩니다.\n\n[font=default-bold]특성:[/font]\n• 일반 스피터보다 체력 25% 감소\n• 충돌 시 시간에 따른 화염 피해\n• 불타는 땅 생성\n• 진화 20%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n이들의 발사체는 기지를 불태울 수 있습니다. 포탑 주변에 돌이나 콘크리트 길을 사용하세요. 화염 저항 장비는 개인 방어에 도움이 됩니다.

5dim-enemies-rocket-spitter=[color=#FFFF66]연노란색 스피터[/color], 폭발성 로켓을 쏩니다.\n\n[font=default-bold]특성:[/font]\n• 일반 스피터보다 체력 25% 감소\n• 폭발성 광역 피해\n• 충돌 시 광역 피해\n• 진화 30%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n광역 피해를 최소화하려면 방어를 분산시키세요. 벽은 로켓 명중을 흡수하는 데 도움이 됩니다. 저격 우선 대상입니다.

5dim-enemies-suicide-spitter=[color=#9900CC]짙은 보라색 스피터[/color], 사망 시 폭발합니다.\n\n[font=default-bold]특성:[/font]\n• 체력 50% 감소\n• 이동 속도 50% 증가\n• [color=red]폭발 시 피해 5배![/color]\n• 진화 30%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n기지에 도달하기 전에 원거리에서 처치하세요. 폭발은 포탑과 벽을 파괴할 수 있습니다. 절대 핵심 기반 시설에 가까이 오게 두지 마세요.

5dim-enemies-poison-spitter=[color=#006600]짙은 초록색 스피터[/color], 독 피해를 줍니다.\n\n[font=default-bold]특성:[/font]\n• 시간에 따른 독 피해\n• 중첩되는 독 효과\n• 진화 20%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n독은 시간이 지나며 구조물을 닳게 할 수 있습니다. 수리 팩과 로봇이 필수적입니다. 개인용 보호막은 독 피해에 도움이 됩니다.

5dim-enemies-electric-spitter=[color=#00FFFF]밝은 청록색 스피터[/color], 연쇄 번개 피해를 줍니다.\n\n[font=default-bold]특성:[/font]\n• 전기/번개 피해\n• 가까운 대상 사이로 튈 수 있음\n• 진화 30%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n연쇄 피해를 막으려면 포탑을 띄워 배치하세요. 고립된 방어 위치가 밀집된 무리보다 효과적입니다.

5dim-enemies-railgun=[color=#008080]Space Age의 청록색 적[/color], 레일건 저항이 있습니다.\n\n[font=default-bold]사용 가능:[/font]\n• 레일건 바이터\n• 레일건 스피터\n• 레일건 땅벌레\n\n[font=default-bold]특성:[/font]\n• 레일건/철갑 피해에 대한 높은 저항\n• 진화 20%~100%에서 출현\n\n[font=default-bold]전략:[/font]\n재래식 무기를 사용하세요. 레일건과 철갑 탄약은 덜 효과적입니다.

5dim-enemies-bosses=[color=#6600CC]보스 적[/color]은 각 적 유형의 거대하고 강력한 변종입니다.\n\n[font=default-bold]보스 배수:[/font]\n• 체력 2배\n• 피해 2배\n• 크기 2배 (시각적으로 더 큼)\n• 이동 속도 40% 감소\n\n[font=default-bold]출현 조건:[/font]\n• 진화 90%에서 나타나기 시작\n• 진화 100%에서 최대 출현율\n• 모든 적 유형에 보스 변종이 있음\n\n[font=default-bold]전략:[/font]\n보스는 집중된 화력이 필요합니다. 대포, 로켓, 집중된 포탑 사격이 필수적입니다. 느리니 이를 유리하게 활용하세요!

