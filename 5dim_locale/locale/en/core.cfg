[mod-setting-description]
5d-space-age-materials=When enabled and Space Age DLC is installed, high-tier progression (5-10) will require both planetary materials in recipes and planetary science packs in technologies, following each module's Space Age progression.
5d-icon-tier-overlay=Adds the tier number badge on item, recipe, technology, and prototype icons that use the shared 5Dim badge helper.
5d-icon-tier-overlay-black-background=Shows the icon tier badge with the current black background. Disable it to keep only the tier number.
5d-entity-tier-overlay=Draws the tier number above supported placed entities at runtime.
5d-entity-tier-overlay-black-background=Shows the entity tier overlay with a black background behind the number. Disable it to keep only the tier number.
5d-machine-work-factor=Global tier-to-tier progression factor for machine work output such as crafting speed, mining speed, research speed, pumping speed, or similar throughput stats. Startup setting. Default: 1.45
5d-machine-energy-factor=Global tier-to-tier progression factor for machine energy usage. Higher values make later tiers more power-hungry to support megabase scaling. Startup setting. Default: 1.75
5d-machine-recipe-factor=Global tier-to-tier progression factor for machine upgrade recipe deltas. Internal rarity weights keep exotic ingredients from scaling as hard as common structural materials. Startup setting. Default: 1.25
5d-machine-tech-factor=Global tier-to-tier progression factor for machine technology research counts. Research counts are rounded to cleaner values. Startup setting. Default: 1.3
5d-machine-t10-next-tier-work=When enabled, the final tier of supported machine families uses the work value of the next theoretical tier, turning T10 into a capstone upgrade without raising its base energy tier. Startup setting.
5d-machine-t10-extra-module-slots=Extra module slots added to the final tier of supported machine families as a capstone bonus. Startup setting. Default: 2
5d-crafting-time-multiplier=Multiplier for all crafting times (Default: 1.0)
5d-change-inventory=Number of inventory slots for the player (Default: 60)
5d-change-stack=Multiplier for item stack sizes
5d-long-reach=Distance for building and opening inventories. For interaction with entire screen: 125 (Default: 6)
5d-long-mine=Extend the mining distance of your player (Default: 6)
5d-mining-speed=Multiplier for player mining speed
5d-light-radius=Radius of the light around the player (Default: 25)
5d-ores=Make all resource deposits infinite
5d-yield=Infinite ores with full yield (100% minimum)
5d-tree=Reduce tree collision box for easier navigation
5d-item-start=Select starting items when creating a new map
5d-equip-start=Select starting equipment when creating a new map
5d-train-tech=Unlock train technologies at game start
5d-robot-tech=Unlock robot technologies at game start
5d-hp=Maximum health points for the player (Default: 250)
5d-healing=Health regeneration per tick (Default: 0.15)
5d-stack-artillery-bullets=Allow artillery shells to stack up to 5
5d-special-turrets=Enables poison, acid, mortar, robot deployer, and flare turrets together with their recipes and technologies.
5d-special-mines=Enables poison and acid mines together with their recipes and technologies.
5d-bicho-spawner-hp=Multiplier for enemy spawner health
5d-bicho-hp=Multiplier for enemy unit health
5d-bicho-healing=Multiplier for enemy healing per tick
5d-suicide=Enable suicide biters that explode on contact
5d-exp=Enable experimental enemy types
5d-worm=Enable behemoth and experimental worms
5d-storage=Enable infinite research for robot cargo size
5d-stack=Enable infinite research for stack inserter capacity
5d-speed=Enable infinite research for research speed bonus
5d-speed-gun-turret=Enable infinite research for gun and turret speed
5d-braking=Enable infinite research for train braking force
5d-grid=Enable equipment grids on vehicles
5d-grid-override=Override equipment grids on all vehicles (requires vehicle grids enabled)