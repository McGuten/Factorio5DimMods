[mod-setting-name]
folk-fill-fuel-stack-size=Taille de pile du carburant (%)
folk-fill-ammo-stack-size=Taille de pile des munitions (%)
5d-autofill-robots=Remplir automatiquement les entités construites par les robots

[mod-setting-description]
folk-fill-ammo-stack-size=Pourcentage de la taille de pile à insérer dans les inventaires de munitions.\n\nRemarque : il s'agit d'un pourcentage de la taille de pile par défaut. Régler sur 100 insérera une pile complète, régler sur 25 insérera 1/4 de pile.\n\nMinimum : 5 % / Maximum 100 %
folk-fill-fuel-stack-size=Pourcentage de la taille de pile à insérer dans les inventaires de carburant.\n\nRemarque : il s'agit d'un pourcentage de la taille de pile par défaut. Régler sur 100 insérera une pile complète, régler sur 25 insérera 1/4 de pile.\n\nMinimum : 5 % / Maximum 100 %
5d-autofill-robots=Lorsque cette option est activée, les tourelles et les véhicules placés par les robots de construction sont également remplis automatiquement, prenant les munitions et le carburant dans le réseau logistique du robot. Désactivée par défaut car plus puissante que le comportement manuel basé sur l'inventaire du joueur.
