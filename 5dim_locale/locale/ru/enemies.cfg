[mod-setting-description]
5d-laser-biter=Включает кусак, устойчивых к лазерному урону
5d-physical-biter=Включает кусак, устойчивых к физическому урону
5d-impact-biter=Включает кусак, устойчивых к урону от удара/взрыва
5d-railgun-biter=Включает кусак, устойчивых к физическому урону, с рельсотронными атаками (требует Space Age)
5d-fire-spitter=Включает плевак, стреляющих струями огня
5d-rocket-spitter=Включает плевак, стреляющих ракетами
5d-suicide=Включает плевак, взрывающихся при контакте
5d-laser-spitter=Включает плевак, стреляющих лазерными лучами
5d-physical-spitter=Включает плевак, бросающих камни/обломки
5d-poison-spitter=Включает плевак, создающих облака яда
5d-electric-spitter=Включает плевак с атаками электрического разряда
5d-broodmother-biter=Включает кусак, порождающих потомство при гибели
5d-broodmother-spitter=Включает плевак, порождающих потомство при гибели
5d-swarm-biter=Включает крошечных быстрых кусак, атакующих большим числом
5d-regenerator-biter=Включает кусак, восстанавливающих здоровье крайне быстро
5d-regenerator-spitter=Включает плевак, восстанавливающих здоровье крайне быстро
5d-berserker-biter=Включает агрессивных кусак с высоким уроном, но низким здоровьем
5d-tank-biter=Включает крайне живучих кусак с 50 % сопротивлением всем типам урона, но низким уроном
5d-tank-spitter=Включает крайне живучих плевак с 50 % сопротивлением всем типам урона, но низким уроном
5d-tank-worm=Включает крайне живучих червей с 50 % сопротивлением всем типам урона, но низким уроном
5d-railgun-spitter=Включает плевак, стреляющих рельсотронными лучами (требует Space Age)
5d-worm=Включает червей уровней Чудовищный и Босс
5d-railgun-worm=Включает червей, стреляющих рельсотронными лучами (требует Space Age)
5d-boss=Включает врагов-боссов (уровень 11), появляющихся при очень высокой эволюции
5d-death-effects=Включает особые эффекты смерти для стихийных врагов (огонь, яд, электричество и т. д.)
5d-death-effect-scale=Масштаб эффектов смерти (0.25 = меньше, 3.0 = намного больше)
5d-typed-damage=Включает типизированный урон для атак врагов (огненные кусаки наносят огненный урон и т. д.)
5d-attack-stickers=Включает наклейки при атаках врагов (огонь вызывает горение, яд вызывает замедление)
5d-health-multiplier=Множитель здоровья врагов (больше = крепче враги)
5d-damage-multiplier=Множитель урона врагов (больше = опаснее атаки)
5d-speed-multiplier=Множитель скорости передвижения врагов (больше = быстрее враги)

