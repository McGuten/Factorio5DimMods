[mod-setting-description]
5d-space-age-materials=활성화되고 Space Age DLC가 설치된 경우, 높은 등급 진행(5–10)은 각 모듈의 Space Age 진행에 따라 제작법에 행성 재료와 기술에 행성 과학 팩이 모두 필요합니다.
5d-icon-tier-overlay=공용 5Dim 배지 도우미를 사용하는 아이템, 제작법, 기술, 프로토타입 아이콘에 등급 번호 배지를 추가합니다.
5d-icon-tier-overlay-black-background=현재 검은 배경이 있는 아이콘 등급 배지를 표시합니다. 비활성화하면 등급 번호만 남습니다.
5d-entity-tier-overlay=실행 중에 지원되는 설치된 개체 위에 등급 번호를 표시합니다.
5d-entity-tier-overlay-black-background=번호 뒤에 검은 배경이 있는 개체 등급 오버레이를 표시합니다. 비활성화하면 등급 번호만 남습니다.
5d-machine-work-factor=제작 속도, 채광 속도, 연구 속도, 펌프 속도 등 기계 작업 산출량에 대한 등급 간 전역 진행 계수. 시작 설정. 기본값: 1.45
5d-machine-energy-factor=기계 에너지 사용량에 대한 등급 간 전역 진행 계수. 값이 높을수록 후반 등급이 더 많은 전력을 소모하여 메가베이스 확장을 지원합니다. 시작 설정. 기본값: 1.75
5d-machine-recipe-factor=기계 업그레이드 제작법 변화량에 대한 등급 간 전역 진행 계수. 내부 희귀도 가중치는 희귀 재료가 일반 구조 재료만큼 가파르게 확장되지 않도록 합니다. 시작 설정. 기본값: 1.25
5d-machine-tech-factor=기계 기술 연구 비용에 대한 등급 간 전역 진행 계수. 연구 비용은 더 깔끔한 값으로 반올림됩니다. 시작 설정. 기본값: 1.3
5d-machine-t10-next-tier-work=활성화하면, 지원되는 기계 계열의 최종 등급이 다음 이론적 등급의 작업 값을 사용하여, 기본 에너지 등급을 올리지 않고 T10을 마무리 업그레이드로 만듭니다. 시작 설정.
5d-machine-t10-extra-module-slots=지원되는 기계 계열의 최종 등급에 마무리 보너스로 추가되는 추가 모듈 슬롯. 시작 설정. 기본값: 2
5d-crafting-time-multiplier=모든 제작 시간에 대한 배수 (기본값: 1.0)
5d-recipe-cost-multiplier=제작법 재료 비용의 전역 배수. 기존 재료 확장과 Space Age 재료 수량에 적용됩니다. 등급별 제작법 진행을 사용하는 기계 계열은 대신 기계 제작법 진행 계수로 제어됩니다. 시작 설정. (기본값: 1.0)
5d-spoil-time-multiplier=모든 부패성 아이템의 부패 시간에 적용되는 배수. 1보다 큰 값은 아이템을 더 오래 유지시키고, 1보다 작은 값은 더 빨리 부패시킵니다. Space Age가 설치된 경우에만 표시됩니다. (기본값: 1.0)
5d-change-inventory=플레이어의 인벤토리 슬롯 수 (기본값: 60)
5d-change-stack=아이템 더미 크기에 대한 배수
5d-long-reach=건설 및 인벤토리 개방 거리. 화면 전체와 상호작용하려면: 125 (기본값: 6)
5d-long-mine=플레이어의 채광 거리를 늘립니다 (기본값: 6)
5d-mining-speed=플레이어 채광 속도에 대한 배수
5d-light-radius=플레이어 주변 빛의 반경 (기본값: 25)
5d-ores=모든 자원 매장지를 무한으로 만들기
5d-yield=완전 산출 무한 광석 (최소 100%)
5d-tree=이동을 쉽게 하도록 나무 충돌 범위를 줄입니다
5d-item-start=새 지도를 만들 때 시작 아이템을 선택하세요
5d-equip-start=새 지도를 만들 때 시작 장비를 선택하세요
5d-train-tech=게임 시작 시 열차 기술 잠금 해제
5d-robot-tech=게임 시작 시 로봇 기술 잠금 해제
5d-hp=플레이어의 최대 체력 (기본값: 250)
5d-healing=틱당 체력 재생 (기본값: 0.15)
5d-stack-artillery-bullets=대포 포탄을 최대 5개까지 쌓을 수 있게 허용
5d-special-turrets=독, 산성, 박격, 로봇 배치, 조명탄 포탑을 해당 제작법 및 기술과 함께 활성화합니다.
5d-special-mines=독 지뢰와 산성 지뢰를 해당 제작법 및 기술과 함께 활성화합니다.
5d-bicho-spawner-hp=적 산란장 체력에 대한 배수
5d-bicho-hp=적 유닛 체력에 대한 배수
5d-bicho-healing=틱당 적 치유에 대한 배수
5d-suicide=접촉 시 폭발하는 자폭 바이터 활성화
5d-exp=실험적 적 유형 활성화
5d-worm=베헤모스 및 실험적 땅벌레 활성화
5d-storage=로봇 화물 크기에 대한 무한 연구 활성화
5d-stack=더미 투입기 용량에 대한 무한 연구 활성화
5d-speed=연구 속도 보너스에 대한 무한 연구 활성화
5d-speed-gun-turret=무기 및 포탑 속도에 대한 무한 연구 활성화
5d-braking=열차 제동력에 대한 무한 연구 활성화
5d-grid=차량의 장비 격자 활성화
5d-grid-override=모든 차량의 장비 격자를 재정의합니다 (차량 격자 활성화 필요)
