[tips-and-tricks-item-description]
5dim-enemies-intro=5Dim's Enemies ajoute une refonte complète du système d'ennemis avec des types d'ennemis spécialisés, un système de progression sur 10 paliers et des ennemis boss.\n\nChaque type d'ennemi possède des caractéristiques, des résistances et des comportements uniques qui exigent des stratégies différentes pour les vaincre. Étudiez chaque type pour préparer vos défenses en conséquence.

5dim-enemies-tiers=Les ennemis dans 5Dim apparaissent désormais en 10 paliers (MK1-MK10) ainsi qu'en puissantes variantes boss.\n\n[font=default-bold]Progression des paliers :[/font]\n• Les paliers évoluent avec le facteur d'évolution\n• Les paliers supérieurs ont plus de santé, de dégâts et de résistances\n• 3 paliers sont actifs à tout niveau d'évolution\n• Chaque type possède des plages d'évolution différentes\n\n[font=default-bold]Ennemis boss :[/font]\n• Apparaissent à haute évolution (90 %+)\n• Multiplicateur de santé et de dégâts x2\n• Échelle x2 (visuellement plus grands)\n• Plus lents mais bien plus dangereux

5dim-enemies-full-battle=Regardez tous les types d'ennemis agir ensemble dans un assaut combiné contre une défense fortifiée !\n\n[font=default-bold]Ennemis de cette bataille :[/font]\n• Déchiqueteurs normaux, laser, physiques, d'impact\n• Pondeurs (engendrent des petits à la mort)\n• Déchiqueteurs grégaires (de nombreux petits ennemis rapides)\n• Déchiqueteurs régénérateurs et berserkers\n• Cracheurs de feu, à roquettes, toxiques, électriques\n\n[font=default-bold]Installation défensive :[/font]\n• Tourelles mitrailleuses (première ligne)\n• Tourelles laser (dégâts élevés)\n• Tourelle lance-flammes (dégâts de zone)\n• Murs de pierre (protection)

5dim-enemies-normal-biter=Des déchiqueteurs standard similaires aux ennemis vanilla.\n\n[font=default-bold]Caractéristiques :[/font]\n• Aucune résistance spéciale\n• Statistiques équilibrées sur tous les paliers\n• Apparaissent de 0 % à 80 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nTout type d'arme est efficace. Idéal pour tester des installations défensives.

5dim-enemies-laser-biter=[color=#4444FF]Déchiqueteurs de couleur bleue[/color] à forte résistance au laser.\n\n[font=default-bold]Caractéristiques :[/font]\n• Résistance aux dégâts laser de 85 %+\n• Vulnérabilité physique normale\n• Apparaissent de 10 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nUtilisez des tourelles mitrailleuses, des lance-flammes ou de l'artillerie. Les tourelles laser sont presque inutiles contre eux.

5dim-enemies-physical-biter=[color=#AAAAAA]Déchiqueteurs blindés gris/argent[/color] à forte résistance aux balles.\n\n[font=default-bold]Caractéristiques :[/font]\n• Résistance aux dégâts physiques de 85 %+\n• Forte réduction des dégâts (réduit les dégâts de façon fixe)\n• Apparaissent de 10 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nUtilisez des tourelles laser, des lance-flammes ou des explosifs. Les tourelles mitrailleuses infligent des dégâts minimes.

5dim-enemies-impact-biter=[color=#8B4513]Déchiqueteurs lourds brun foncé[/color] qui infligent des dégâts d'impact.\n\n[font=default-bold]Caractéristiques :[/font]\n• 30 % de santé en plus que la normale\n• 50 % de dégâts en plus\n• Déplacement 15 % plus lent\n• Résistants aux dégâts d'impact\n• Apparaissent de 10 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nIls sont plus lents, donc le kiting est efficace. Utilisez des armes à longue portée pour réduire leur nombre avant qu'ils n'atteignent vos murs.

5dim-enemies-broodmother-biter=[color=#FF00FF]Déchiqueteurs magenta/roses[/color] qui engendrent une progéniture lorsqu'ils sont tués.\n\n[font=default-bold]Caractéristiques :[/font]\n• 50 % de santé en plus (résistants)\n• Déplacement 30 % plus lent\n• 20 % de dégâts en moins\n• [color=red]À la mort : 50 % de chance d'engendrer un déchiqueteur de palier inférieur[/color]\n• Apparaissent de 25 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nUtilisez des armes à forts dégâts pour les tuer d'un coup si possible. Les armes de zone peuvent gérer la progéniture engendrée. Les lance-flammes sont excellents car ils endommagent à la fois la pondeuse et sa progéniture.

5dim-enemies-swarm-biter=[color=#FFD700]Petits déchiqueteurs dorés/fauves[/color] qui attaquent en grand nombre.\n\n[font=default-bold]Caractéristiques :[/font]\n• 75 % de santé en moins (très fragiles)\n• 50 % de dégâts en moins\n• Déplacement 50 % plus rapide\n• Échelle à 70 % de la normale (plus petits)\n• [color=cyan]Les nids produisent 2x d'unités à 2x la vitesse[/color]\n• Apparaissent de 10 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nLes armes de zone brillent ici. Les lance-flammes, les roquettes et les grenades peuvent anéantir des essaims entiers. Les armes à cible unique seront submergées.

5dim-enemies-regenerator-biter=[color=#00FF00]Déchiqueteurs vert citron vif[/color] qui se soignent extrêmement vite.\n\n[font=default-bold]Caractéristiques :[/font]\n• 25 % de santé en moins\n• [color=cyan]Taux de soin 5x plus rapide[/color]\n• [color=red]Faibles face au feu (-25 % de résistance)[/color]\n• Apparaissent de 20 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nConcentrez le feu pour les tuer rapidement, ou utilisez des dégâts de feu pour exploiter leur faiblesse. Si vous les laissez battre en retraite, ils reviendront à pleine santé presque instantanément.

5dim-enemies-berserker-biter=[color=#CC0000]Déchiqueteurs rouge sang[/color] qui sont des canons de verre.\n\n[font=default-bold]Caractéristiques :[/font]\n• 50 % de santé en moins\n• [color=red]Dégâts x2 (très dangereux !)[/color]\n• Déplacement 30 % plus rapide\n• [color=cyan]Ne peuvent pas du tout se soigner[/color]\n• Subissent 10 % de dégâts physiques supplémentaires\n• Apparaissent de 25 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nTuez-les avant qu'ils n'atteignent vos murs ! De forts dégâts en rafale sont essentiels. Ils infligent des dégâts dévastateurs mais meurent vite. Les murs sont cruciaux pour les ralentir.

5dim-enemies-tank=[color=#808000]Ennemis vert olive militaire[/color] qui résistent également à tous les types de dégâts.\n\n[font=default-bold]Disponibles :[/font]\n• Déchiqueteurs cuirassés\n• Cracheurs cuirassés\n• Vers cuirassés\n\n[font=default-bold]Caractéristiques :[/font]\n• [color=cyan]50 % de résistance à TOUS les types de dégâts[/color] (physique, laser, feu, poison, électrique, explosion, acide, impact)\n• [color=cyan]Santé x2[/color] (extrêmement résistants)\n• [color=red]65 % de dégâts en moins[/color]\n• Déplacement 20 % plus lent\n• Aucune réduction de dégâts fixe, uniquement en pourcentage\n• Apparaissent de 15 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nAucun type d'arme n'est particulièrement efficace ou faible contre eux. Utilisez vos armes au DPS le plus élevé. Leurs faibles dégâts signifient qu'ils ne sont pas immédiatement menaçants, mais ils peuvent distraire vos défenses pendant que des ennemis plus dangereux approchent.

5dim-enemies-fire-spitter=[color=#FF6600]Cracheurs orange/de feu[/color] qui tirent des projectiles enflammés.\n\n[font=default-bold]Caractéristiques :[/font]\n• 25 % de santé en moins que les cracheurs normaux\n• Dégâts de feu dans le temps à l'impact\n• Créent un sol enflammé\n• Apparaissent de 20 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nLeurs projectiles peuvent mettre le feu à votre base. Utilisez des chemins en pierre ou en béton autour des tourelles. L'équipement résistant au feu aide pour la défense personnelle.

5dim-enemies-rocket-spitter=[color=#FFFF66]Cracheurs jaune pâle[/color] qui tirent des roquettes explosives.\n\n[font=default-bold]Caractéristiques :[/font]\n• 25 % de santé en moins que les cracheurs normaux\n• Dégâts d'éclaboussure explosifs\n• Dégâts de zone à l'impact\n• Apparaissent de 30 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nDispersez vos défenses pour minimiser les dégâts d'éclaboussure. Les murs aident à absorber les tirs de roquette. Cibles prioritaires pour le tir de précision.

5dim-enemies-suicide-spitter=[color=#9900CC]Cracheurs violet foncé[/color] qui explosent à la mort.\n\n[font=default-bold]Caractéristiques :[/font]\n• 50 % de santé en moins\n• Déplacement 50 % plus rapide\n• [color=red]Dégâts x5 à l'explosion ![/color]\n• Apparaissent de 30 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nTuez-les à distance avant qu'ils n'atteignent votre base. Leurs explosions peuvent détruire tourelles et murs. Ne les laissez jamais s'approcher des infrastructures critiques.

5dim-enemies-poison-spitter=[color=#006600]Cracheurs vert foncé[/color] qui infligent des dégâts de poison.\n\n[font=default-bold]Caractéristiques :[/font]\n• Dégâts de poison dans le temps\n• Effet de poison cumulable\n• Apparaissent de 20 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nLe poison peut user vos structures avec le temps. Les kits de réparation et les robots sont essentiels. Les boucliers personnels aident contre les dégâts de poison.

5dim-enemies-electric-spitter=[color=#00FFFF]Cracheurs cyan vif[/color] qui infligent des dégâts de foudre en chaîne.\n\n[font=default-bold]Caractéristiques :[/font]\n• Dégâts électriques/de foudre\n• Peuvent rebondir entre les cibles proches\n• Apparaissent de 30 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nEspacez vos tourelles pour éviter les dégâts en chaîne. Les positions défensives isolées sont plus efficaces que les regroupements denses.

5dim-enemies-railgun=[color=#008080]Ennemis sarcelle[/color] de Space Age résistants au railgun.\n\n[font=default-bold]Disponibles :[/font]\n• Déchiqueteurs railgun\n• Cracheurs railgun\n• Vers railgun\n\n[font=default-bold]Caractéristiques :[/font]\n• Forte résistance aux dégâts de railgun/perforants\n• Apparaissent de 20 % à 100 % d'évolution\n\n[font=default-bold]Stratégie :[/font]\nUtilisez des armes conventionnelles. Les railguns et les munitions perforantes sont moins efficaces.

5dim-enemies-bosses=[color=#6600CC]Les ennemis boss[/color] sont des variantes massives et puissantes de chaque type d'ennemi.\n\n[font=default-bold]Multiplicateurs des boss :[/font]\n• Santé x2\n• Dégâts x2\n• Échelle x2 (visuellement plus grands)\n• Déplacement 40 % plus lent\n\n[font=default-bold]Conditions d'apparition :[/font]\n• Commencent à apparaître à 90 % d'évolution\n• Taux d'apparition maximal à 100 % d'évolution\n• Tous les types d'ennemis ont des variantes boss\n\n[font=default-bold]Stratégie :[/font]\nLes boss exigent une puissance de feu concentrée. L'artillerie, les roquettes et le tir de tourelle concentré sont essentiels. Ils sont lents, profitez-en !

