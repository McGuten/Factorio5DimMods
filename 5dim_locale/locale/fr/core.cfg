[mod-setting-description]
5d-space-age-materials=Lorsque cette option est activée et que le DLC Space Age est installé, la progression de haut palier (5-10) nécessitera à la fois des matériaux planétaires dans les recettes et des packs de science planétaires dans les technologies, suivant la progression Space Age de chaque module.
5d-icon-tier-overlay=Ajoute le badge du numéro de palier sur les icônes d'objets, de recettes, de technologies et de prototypes qui utilisent l'assistant de badge partagé de 5Dim.
5d-icon-tier-overlay-black-background=Affiche le badge de palier des icônes avec le fond noir actuel. Désactivez-le pour ne garder que le numéro de palier.
5d-entity-tier-overlay=Affiche le numéro de palier au-dessus des entités placées prises en charge pendant le jeu.
5d-entity-tier-overlay-black-background=Affiche la surcouche de palier des entités avec un fond noir derrière le numéro. Désactivez-la pour ne garder que le numéro de palier.
5d-machine-work-factor=Facteur de progression global de palier en palier pour le rendement de travail des machines tel que la vitesse de fabrication, la vitesse de minage, la vitesse de recherche, la vitesse de pompage ou d'autres statistiques de débit similaires. Réglage de démarrage. Par défaut : 1.45
5d-machine-energy-factor=Facteur de progression global de palier en palier pour la consommation d'énergie des machines. Des valeurs plus élevées rendent les paliers ultérieurs plus gourmands en énergie pour soutenir l'extension en mégabase. Réglage de démarrage. Par défaut : 1.75
5d-machine-recipe-factor=Facteur de progression global de palier en palier pour les variations des recettes d'amélioration des machines. Des poids de rareté internes empêchent les ingrédients exotiques d'augmenter aussi fortement que les matériaux structurels communs. Réglage de démarrage. Par défaut : 1.25
5d-machine-tech-factor=Facteur de progression global de palier en palier pour le nombre de recherches technologiques des machines. Le nombre de recherches est arrondi à des valeurs plus nettes. Réglage de démarrage. Par défaut : 1.3
5d-machine-t10-next-tier-work=Lorsque cette option est activée, le palier final des familles de machines prises en charge utilise la valeur de travail du palier théorique suivant, transformant le T10 en amélioration de couronnement sans relever son palier d'énergie de base. Réglage de démarrage.
5d-machine-t10-extra-module-slots=Emplacements de module supplémentaires ajoutés au palier final des familles de machines prises en charge en guise de bonus de couronnement. Réglage de démarrage. Par défaut : 2
5d-crafting-time-multiplier=Multiplicateur pour tous les temps de fabrication (par défaut : 1.0)
5d-recipe-cost-multiplier=Multiplicateur global du coût des ingrédients de recette. S'applique à l'augmentation héritée des ingrédients et aux quantités de matériaux de Space Age. Les familles de machines qui utilisent une progression de recette par palier sont régies par le facteur de progression des recettes des machines à la place. Réglage de démarrage. (par défaut : 1.0)
5d-spoil-time-multiplier=Multiplicateur appliqué au temps de pourrissement de tous les objets périssables. Les valeurs supérieures à 1 font durer les objets plus longtemps ; les valeurs inférieures à 1 les font pourrir plus vite. Visible uniquement lorsque Space Age est installé. (par défaut : 1.0)
5d-change-inventory=Nombre d'emplacements d'inventaire du joueur (par défaut : 60)
5d-change-stack=Multiplicateur de la taille des piles d'objets
5d-long-reach=Distance pour construire et ouvrir les inventaires. Pour interagir avec tout l'écran : 125 (par défaut : 6)
5d-long-mine=Étend la distance de minage de votre joueur (par défaut : 6)
5d-mining-speed=Multiplicateur de la vitesse de minage du joueur
5d-light-radius=Rayon de la lumière autour du joueur (par défaut : 25)
5d-ores=Rendre tous les gisements de ressources infinis
5d-yield=Minerais infinis à rendement complet (100 % minimum)
5d-tree=Réduire la boîte de collision des arbres pour faciliter la navigation
5d-item-start=Sélectionner les objets de départ lors de la création d'une nouvelle carte
5d-equip-start=Sélectionner l'équipement de départ lors de la création d'une nouvelle carte
5d-train-tech=Débloquer les technologies de trains au début de la partie
5d-robot-tech=Débloquer les technologies de robots au début de la partie
5d-hp=Points de vie maximum du joueur (par défaut : 250)
5d-healing=Régénération de santé par tick (par défaut : 0.15)
5d-stack-artillery-bullets=Permettre aux obus d'artillerie de s'empiler jusqu'à 5
5d-special-turrets=Active les tourelles à poison, à acide, à mortier, de déploiement de robots et à fusées éclairantes ainsi que leurs recettes et technologies.
5d-special-mines=Active les mines à poison et à acide ainsi que leurs recettes et technologies.
5d-bicho-spawner-hp=Multiplicateur de la santé des nids d'ennemis
5d-bicho-hp=Multiplicateur de la santé des unités ennemies
5d-bicho-healing=Multiplicateur du soin des ennemis par tick
5d-suicide=Activer des déchiqueteurs kamikazes qui explosent au contact
5d-exp=Activer les types d'ennemis expérimentaux
5d-worm=Activer les vers colossaux et expérimentaux
5d-storage=Activer la recherche infinie pour la capacité de transport des robots
5d-stack=Activer la recherche infinie pour la capacité des bras robotisés à pile
5d-speed=Activer la recherche infinie pour le bonus de vitesse de recherche
5d-speed-gun-turret=Activer la recherche infinie pour la vitesse des armes et des tourelles
5d-braking=Activer la recherche infinie pour la force de freinage des trains
5d-grid=Activer les grilles d'équipement sur les véhicules
5d-grid-override=Remplacer les grilles d'équipement sur tous les véhicules (nécessite l'activation des grilles de véhicule)
