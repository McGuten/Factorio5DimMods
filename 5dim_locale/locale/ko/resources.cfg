[technology-description]
5d-vulcanus-resources=텅스텐 가루, 방해석 가루, 촉매 용암 처리를 잠금 해제합니다.
5d-fulgora-resources=홀뮴 가루, 압축 고철, 고철 재활용을 잠금 해제합니다.
5d-gleba-resources=농축 유마코 및 젤리너트 처리를 잠금 해제합니다.
5d-aquilo-resources=강화된 암모니아 용액 분리와 리튬 처리를 잠금 해제합니다.
5d-orbit-resources=소행성을 가루로 으깨기와 그 가루를 소비하는 기본 궤도 분쇄 제작법을 잠금 해제합니다.
5d-advanced-orbit-resources=더 높은 처리 비용으로 소행성 가루를 소비하는 고급 궤도 분쇄 제작법을 잠금 해제합니다.

