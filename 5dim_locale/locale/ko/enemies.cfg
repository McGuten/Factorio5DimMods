[mod-setting-description]
5d-laser-biter=레이저 피해에 저항하는 바이터 활성화
5d-physical-biter=물리 피해에 저항하는 바이터 활성화
5d-impact-biter=충격/폭발 피해에 저항하는 바이터 활성화
5d-railgun-biter=레일건 공격으로 물리 피해에 저항하는 바이터 활성화 (Space Age 필요)
5d-fire-spitter=화염 줄기를 쏘는 스피터 활성화
5d-rocket-spitter=로켓을 쏘는 스피터 활성화
5d-suicide=접촉 시 폭발하는 스피터 활성화
5d-laser-spitter=레이저 광선을 쏘는 스피터 활성화
5d-physical-spitter=돌/파편을 던지는 스피터 활성화
5d-poison-spitter=독 구름을 생성하는 스피터 활성화
5d-electric-spitter=전기 방전 공격을 하는 스피터 활성화
5d-broodmother-biter=사망 시 새끼를 생성하는 바이터 활성화
5d-broodmother-spitter=사망 시 새끼를 생성하는 스피터 활성화
5d-swarm-biter=많은 수로 공격하는 작고 빠른 바이터 활성화
5d-regenerator-biter=체력을 극도로 빠르게 재생하는 바이터 활성화
5d-regenerator-spitter=체력을 극도로 빠르게 재생하는 스피터 활성화
5d-berserker-biter=높은 피해를 주지만 체력이 낮은 공격적인 바이터 활성화
5d-tank-biter=모든 피해 유형에 50% 저항하지만 피해가 낮은 극도로 단단한 바이터 활성화
5d-tank-spitter=모든 피해 유형에 50% 저항하지만 피해가 낮은 극도로 단단한 스피터 활성화
5d-tank-worm=모든 피해 유형에 50% 저항하지만 피해가 낮은 극도로 단단한 땅벌레 활성화
5d-railgun-spitter=레일건 광선을 쏘는 스피터 활성화 (Space Age 필요)
5d-worm=베헤모스 및 보스 등급 땅벌레 활성화
5d-railgun-worm=레일건 광선을 쏘는 땅벌레 활성화 (Space Age 필요)
5d-boss=매우 높은 진화에서 나타나는 보스(11등급) 적 활성화
5d-death-effects=속성 적(화염, 독, 전기 등)에 대한 특수 사망 효과 활성화
5d-death-effect-scale=사망 효과의 크기 (0.25 = 더 작게, 3.0 = 훨씬 크게)
5d-typed-damage=적 공격의 유형별 피해 활성화 (화염 바이터는 화염 피해를 줌 등)
5d-attack-stickers=적 공격의 스티커 활성화 (화염은 화상, 독은 둔화 유발)
5d-health-multiplier=적 체력에 대한 배수 (높을수록 = 더 강한 적)
5d-damage-multiplier=적 피해에 대한 배수 (높을수록 = 더 위험한 공격)
5d-speed-multiplier=적 이동 속도에 대한 배수 (높을수록 = 더 빠른 적)

