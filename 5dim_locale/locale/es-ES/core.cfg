[mod-setting-description]
5d-space-age-materials=Cuando está activado y el DLC Space Age está instalado, la progresión de tier alto (5-10) requerirá tanto materiales planetarios en las recetas como packs de ciencia planetarios en las tecnologías, siguiendo la progresión Space Age de cada módulo.
5d-icon-tier-overlay=Añade la insignia con el número de tier a los iconos de objetos, recetas, tecnologías y prototipos que usan el sistema de insignias compartido de 5Dim.
5d-icon-tier-overlay-black-background=Muestra la insignia de tier del icono con el fondo negro actual. Desactívalo para conservar solo el número de tier.
5d-entity-tier-overlay=Dibuja el número de tier sobre las entidades colocadas compatibles durante el juego.
5d-entity-tier-overlay-black-background=Muestra el indicador de tier de la entidad con un fondo negro detrás del número. Desactívalo para conservar solo el número de tier.
5d-machine-work-factor=Factor global de progresión entre tiers para el trabajo de las máquinas, como velocidad de fabricación, velocidad de minería, velocidad de investigación, velocidad de bombeo o estadísticas de rendimiento similares. Ajuste de inicio. Por defecto: 1.45
5d-machine-energy-factor=Factor global de progresión entre tiers para el consumo de energía de las máquinas. Los valores más altos hacen que los tiers avanzados consuman más energía para soportar el escalado de megabases. Ajuste de inicio. Por defecto: 1.75
5d-machine-recipe-factor=Factor global de progresión entre tiers para los deltas de receta al mejorar máquinas. Los pesos internos por rareza evitan que los ingredientes exóticos escalen tan fuerte como los materiales estructurales comunes. Ajuste de inicio. Por defecto: 1.25
5d-machine-tech-factor=Factor global de progresión entre tiers para los costes de investigación de las tecnologías de máquinas. Los costes se redondean a valores más limpios. Ajuste de inicio. Por defecto: 1.3
5d-machine-t10-next-tier-work=Cuando está activado, el tier final de las familias de máquinas compatibles usa el valor de trabajo del siguiente tier teórico, convirtiendo el T10 en una mejora final sin subir su tier base de energía. Ajuste de inicio.
5d-machine-t10-extra-module-slots=Ranuras de módulos extra añadidas al tier final de las familias de máquinas compatibles como bonificación final. Ajuste de inicio. Por defecto: 2
5d-crafting-time-multiplier=Multiplicador para todos los tiempos de fabricación (Por defecto: 1.0)
5d-recipe-cost-multiplier=Multiplicador global para el coste de los ingredientes de las recetas. Se aplica al escalado de ingredientes heredado y a las cantidades de materiales de Space Age. Las familias de máquinas que usan progresión de receta por tier se rigen en su lugar por el Factor de progresión de recetas de máquinas. Ajuste de inicio. (Por defecto: 1.0)
5d-spoil-time-multiplier=Multiplicador aplicado al tiempo de descomposición de todos los objetos perecederos. Los valores superiores a 1 hacen que los objetos duren más; los inferiores a 1 hacen que se descompongan más rápido. Solo visible cuando Space Age está instalado. (Por defecto: 1.0)
5d-change-inventory=Número de ranuras de inventario del jugador (Por defecto: 60)
5d-change-stack=Multiplicador para el tamaño de los stacks de objetos
5d-long-reach=Distancia para construir y abrir inventarios. Para interactuar con toda la pantalla: 125 (Por defecto: 6)
5d-long-mine=Amplía la distancia de minería del jugador (Por defecto: 6)
5d-mining-speed=Multiplicador para la velocidad de minería del jugador
5d-light-radius=Radio de la luz alrededor del jugador (Por defecto: 25)
5d-ores=Hace infinitos todos los yacimientos de recursos
5d-yield=Minerales infinitos con rendimiento completo (100 % mínimo)
5d-tree=Reduce la caja de colisión de los árboles para facilitar el desplazamiento
5d-item-start=Selecciona los objetos iniciales al crear un mapa nuevo
5d-equip-start=Selecciona el equipamiento inicial al crear un mapa nuevo
5d-train-tech=Desbloquea las tecnologías de trenes al empezar la partida
5d-robot-tech=Desbloquea las tecnologías de robots al empezar la partida
5d-hp=Puntos de salud máximos del jugador (Por defecto: 250)
5d-healing=Regeneración de salud por tick (Por defecto: 0.15)
5d-stack-artillery-bullets=Permite apilar los proyectiles de artillería hasta 5
5d-special-turrets=Activa las torretas de veneno, ácido, mortero, desplegador de robots y bengala junto con sus recetas y tecnologías.
5d-special-mines=Activa las minas de veneno y ácido junto con sus recetas y tecnologías.
5d-bicho-spawner-hp=Multiplicador para la salud de los nidos de enemigos
5d-bicho-hp=Multiplicador para la salud de las unidades enemigas
5d-bicho-healing=Multiplicador para la curación de los enemigos por tick
5d-suicide=Activa los mordedores suicidas que explotan al contacto
5d-exp=Activa los tipos de enemigos experimentales
5d-worm=Activa los gusanos mastodonte y experimentales
5d-storage=Activa la investigación infinita para la capacidad de carga de los robots
5d-stack=Activa la investigación infinita para la capacidad del insertador de apilamiento
5d-speed=Activa la investigación infinita para la bonificación de velocidad de investigación
5d-speed-gun-turret=Activa la investigación infinita para la velocidad de armas y torretas
5d-braking=Activa la investigación infinita para la fuerza de frenado de los trenes
5d-grid=Activa las cuadrículas de equipamiento en los vehículos
5d-grid-override=Sobrescribe las cuadrículas de equipamiento en todos los vehículos (requiere las cuadrículas de vehículos activadas)
