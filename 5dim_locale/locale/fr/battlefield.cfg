5d-tungsten-shotgun-shell=Cartouches de fusil à pompe chargées de tungstène dense qui se situent entre le perforant et la puissance d'arrêt de l'uranium.
5d-uranium-shotgun-shell=Cartouches de fusil à pompe haut de gamme remplies de plomb d'uranium pour un impact maximal.
5d-uranium-tungsten-shotgun-shell=Cartouches de fusil à pompe de fin de partie qui renforcent le plomb d'uranium avec du tungstène pour les coups les plus puissants de la gamme.
5d-poison-rounds=Munitions spécialisées qui infligent des dégâts de poison et créent un nuage de poison à l'impact.
5d-acid-rounds=Munitions corrosives qui infligent des dégâts d'acide et créent une éclaboussure d'acide à l'impact.
5d-poison-turret-1=Variante de tourelle mitrailleuse qui tire des munitions toxiques et crée des nuages de poison à l'impact. Les paliers supérieurs gagnent en portée, durabilité et dégâts.
