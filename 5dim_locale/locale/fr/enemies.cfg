[mod-setting-description]
5d-laser-biter=Activer des déchiqueteurs résistants aux dégâts laser
5d-physical-biter=Activer des déchiqueteurs résistants aux dégâts physiques
5d-impact-biter=Activer des déchiqueteurs résistants aux dégâts d'impact/explosion
5d-railgun-biter=Activer des déchiqueteurs résistants aux dégâts physiques avec des attaques de railgun (nécessite Space Age)
5d-fire-spitter=Activer des cracheurs qui projettent des jets de feu
5d-rocket-spitter=Activer des cracheurs qui tirent des roquettes
5d-suicide=Activer des cracheurs qui explosent au contact
5d-laser-spitter=Activer des cracheurs qui tirent des rayons laser
5d-physical-spitter=Activer des cracheurs qui projettent des pierres/débris
5d-poison-spitter=Activer des cracheurs qui créent des nuages de poison
5d-electric-spitter=Activer des cracheurs aux attaques de décharge électrique
5d-broodmother-biter=Activer des déchiqueteurs qui engendrent une progéniture à leur mort
5d-broodmother-spitter=Activer des cracheurs qui engendrent une progéniture à leur mort
5d-swarm-biter=Activer de minuscules déchiqueteurs rapides qui attaquent en grand nombre
5d-regenerator-biter=Activer des déchiqueteurs qui régénèrent leur santé extrêmement vite
5d-regenerator-spitter=Activer des cracheurs qui régénèrent leur santé extrêmement vite
5d-berserker-biter=Activer des déchiqueteurs agressifs aux dégâts élevés mais à la faible santé
5d-tank-biter=Activer des déchiqueteurs extrêmement résistants avec 50 % de résistance à tous les types de dégâts mais de faibles dégâts
5d-tank-spitter=Activer des cracheurs extrêmement résistants avec 50 % de résistance à tous les types de dégâts mais de faibles dégâts
5d-tank-worm=Activer des vers extrêmement résistants avec 50 % de résistance à tous les types de dégâts mais de faibles dégâts
5d-railgun-spitter=Activer des cracheurs qui tirent des rayons de railgun (nécessite Space Age)
5d-worm=Activer les vers de palier colossal et boss
5d-railgun-worm=Activer des vers qui tirent des rayons de railgun (nécessite Space Age)
5d-boss=Activer les ennemis boss (palier 11) qui apparaissent à très haute évolution
5d-death-effects=Activer des effets de mort spéciaux pour les ennemis élémentaires (feu, poison, électrique, etc.)
5d-death-effect-scale=Échelle des effets de mort (0.25 = plus petit, 3.0 = beaucoup plus grand)
5d-typed-damage=Activer les dégâts typés pour les attaques ennemies (les déchiqueteurs de feu infligent des dégâts de feu, etc.)
5d-attack-stickers=Activer les marqueurs sur les attaques ennemies (le feu provoque des brûlures, le poison provoque un ralentissement)
5d-health-multiplier=Multiplicateur de la santé des ennemis (plus élevé = ennemis plus résistants)
5d-damage-multiplier=Multiplicateur des dégâts des ennemis (plus élevé = attaques plus dangereuses)
5d-speed-multiplier=Multiplicateur de la vitesse de déplacement des ennemis (plus élevé = ennemis plus rapides)

