[tips-and-tricks-item-description]
5dim-enemies-intro=Враги 5Dim полностью перерабатывают систему врагов, добавляя специализированные типы врагов, систему прогрессии из 10 уровней и врагов-боссов.\n\nКаждый тип врага обладает уникальными характеристиками, сопротивлениями и поведением, которые требуют разных стратегий для уничтожения. Изучай каждый тип, чтобы соответствующим образом подготовить оборону.

5dim-enemies-tiers=Враги в 5Dim теперь появляются в 10 уровнях (MK1–MK10) плюс мощные варианты-боссы.\n\n[font=default-bold]Прогрессия уровней:[/font]\n• Уровни масштабируются с фактором эволюции\n• Высшие уровни имеют больше здоровья, урона и сопротивлений\n• На любом уровне эволюции активны 3 уровня\n• У каждого типа свои диапазоны эволюции\n\n[font=default-bold]Враги-боссы:[/font]\n• Появляются при высокой эволюции (90 %+)\n• Множитель здоровья и урона 2x\n• Масштаб 2x (визуально крупнее)\n• Медленнее, но намного опаснее

5dim-enemies-full-battle=Наблюдайте, как все типы врагов действуют сообща в комбинированном штурме против укреплённой обороны!\n\n[font=default-bold]Враги в этой битве:[/font]\n• Обычные, лазерные, физические и ударные кусаки\n• Матка (порождает детёнышей при гибели)\n• Роевые кусаки (множество мелких быстрых врагов)\n• Регенерирующие и бешеные кусаки\n• Огненные, ракетные, ядовитые и электрические плеваки\n\n[font=default-bold]Оборонительное построение:[/font]\n• Пулемётные турели (передовая)\n• Лазерные турели (высокий урон)\n• Огнемётная турель (урон по площади)\n• Каменные стены (защита)

5dim-enemies-normal-biter=Стандартные кусаки, схожие с ванильными врагами.\n\n[font=default-bold]Характеристики:[/font]\n• Без особых сопротивлений\n• Сбалансированные характеристики на всех уровнях\n• Появляются от 0 % до 80 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nЛюбой тип оружия эффективен. Хороши для проверки оборонительных построений.

5dim-enemies-laser-biter=[color=#4444FF]Синие кусаки[/color] с высоким сопротивлением лазеру.\n\n[font=default-bold]Характеристики:[/font]\n• 85 %+ сопротивления лазерному урону\n• Обычная физическая уязвимость\n• Появляются от 10 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nИспользуйте пулемётные турели, огнемёты или артиллерию. Лазерные турели против них почти бесполезны.

5dim-enemies-physical-biter=[color=#AAAAAA]Серо-серебристые бронированные кусаки[/color] с высоким сопротивлением пулям.\n\n[font=default-bold]Характеристики:[/font]\n• 85 %+ сопротивления физическому урону\n• Высокое снижение урона (снижает урон на фиксированную величину)\n• Появляются от 10 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nИспользуйте лазерные турели, огнемёты или взрывчатку. Пулемётные турели наносят минимальный урон.

5dim-enemies-impact-biter=[color=#8B4513]Тёмно-коричневые тяжёлые кусаки[/color], наносящие урон от удара.\n\n[font=default-bold]Характеристики:[/font]\n• На 30 % больше здоровья, чем у обычных\n• На 50 % больше урона\n• На 15 % медленнее передвижение\n• Устойчивы к урону от удара\n• Появляются от 10 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nОни медленнее, поэтому кайтинг эффективен. Используйте дальнобойное оружие, чтобы проредить их число до того, как они достигнут ваших стен.

5dim-enemies-broodmother-biter=[color=#FF00FF]Пурпурно-розовые кусаки[/color], порождающие потомство при уничтожении.\n\n[font=default-bold]Характеристики:[/font]\n• На 50 % больше здоровья (живучие)\n• На 30 % медленнее передвижение\n• На 20 % меньше урона\n• [color=red]При гибели: 50 % шанс породить кусаку более низкого уровня[/color]\n• Появляются от 25 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nИспользуйте оружие с высоким уроном, чтобы убивать их с одного выстрела, когда возможно. Оружие по площади справляется с порождённым потомством. Огнемёты превосходны, так как наносят урон и матке, и её потомству.

5dim-enemies-swarm-biter=[color=#FFD700]Маленькие золотисто-песочные кусаки[/color], атакующие большим числом.\n\n[font=default-bold]Характеристики:[/font]\n• На 75 % меньше здоровья (очень хрупкие)\n• На 50 % меньше урона\n• На 50 % быстрее передвижение\n• 70 % обычного масштаба (мельче)\n• [color=cyan]Ульи производят 2x юнитов с 2x скоростью[/color]\n• Появляются от 10 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nОружие по площади здесь блистает. Огнемёты, ракеты и гранаты могут уничтожать целые рои. Оружие по одиночной цели будет перегружено.

5dim-enemies-regenerator-biter=[color=#00FF00]Ярко-салатовые кусаки[/color], исцеляющиеся крайне быстро.\n\n[font=default-bold]Характеристики:[/font]\n• На 25 % меньше здоровья\n• [color=cyan]В 5 раз быстрее скорость исцеления[/color]\n• [color=red]Уязвимы к огню (-25 % сопротивления)[/color]\n• Появляются от 20 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nСосредоточьте огонь, чтобы убить их быстро, или используйте огненный урон, чтобы воспользоваться их слабостью. Если позволить им отступить, они вернутся с полным здоровьем почти мгновенно.

5dim-enemies-berserker-biter=[color=#CC0000]Кроваво-красные кусаки[/color] — хрупкие, но мощные бойцы.\n\n[font=default-bold]Характеристики:[/font]\n• На 50 % меньше здоровья\n• [color=red]2x урона (очень опасны!)[/color]\n• На 30 % быстрее передвижение\n• [color=cyan]Вообще не могут исцеляться[/color]\n• Получают на 10 % больше физического урона\n• Появляются от 25 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nУбивайте их до того, как они достигнут ваших стен! Высокий взрывной урон необходим. Они наносят разрушительный урон, но быстро гибнут. Стены крайне важны для их замедления.

5dim-enemies-tank=[color=#808000]Военно-оливковые враги[/color], одинаково сопротивляющиеся всем типам урона.\n\n[font=default-bold]Доступны:[/font]\n• Танковые кусаки\n• Танковые плеваки\n• Танковые черви\n\n[font=default-bold]Характеристики:[/font]\n• [color=cyan]50 % сопротивления ВСЕМ типам урона[/color] (физический, лазер, огонь, яд, электричество, взрыв, кислота, удар)\n• [color=cyan]2x здоровья[/color] (крайне живучие)\n• [color=red]На 65 % меньше урона[/color]\n• На 20 % медленнее передвижение\n• Без плоского снижения урона, только процентное\n• Появляются от 15 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nНи один тип оружия не особенно эффективен или слаб против них. Используйте оружие с наибольшим уроном в секунду. Их низкий урон означает, что они не представляют немедленной угрозы, но могут отвлекать вашу оборону, пока приближаются более опасные враги.

5dim-enemies-fire-spitter=[color=#FF6600]Оранжевые/огненные плеваки[/color], стреляющие огненными снарядами.\n\n[font=default-bold]Характеристики:[/font]\n• На 25 % меньше здоровья, чем у обычных плевак\n• Огненный урон со временем при попадании\n• Создают горящую землю\n• Появляются от 20 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nИх снаряды могут поджечь вашу базу. Используйте каменные или бетонные дорожки вокруг турелей. Огнеупорное снаряжение помогает для персональной защиты.

5dim-enemies-rocket-spitter=[color=#FFFF66]Бледно-жёлтые плеваки[/color], стреляющие взрывными ракетами.\n\n[font=default-bold]Характеристики:[/font]\n• На 25 % меньше здоровья, чем у обычных плевак\n• Взрывной урон по площади\n• Урон по площади при попадании\n• Появляются от 30 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nРазнесите свою оборону, чтобы минимизировать урон по площади. Стены помогают поглощать попадания ракет. Приоритетные цели для снайпинга.

5dim-enemies-suicide-spitter=[color=#9900CC]Тёмно-фиолетовые плеваки[/color], взрывающиеся при гибели.\n\n[font=default-bold]Характеристики:[/font]\n• На 50 % меньше здоровья\n• На 50 % быстрее передвижение\n• [color=red]5x урона при взрыве![/color]\n• Появляются от 30 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nУбивайте их на расстоянии, прежде чем они достигнут вашей базы. Их взрывы могут уничтожать турели и стены. Никогда не подпускайте их к критической инфраструктуре.

5dim-enemies-poison-spitter=[color=#006600]Тёмно-зелёные плеваки[/color], наносящие ядовитый урон.\n\n[font=default-bold]Характеристики:[/font]\n• Ядовитый урон со временем\n• Накапливающийся эффект яда\n• Появляются от 20 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nЯд может изнашивать ваши строения со временем. Ремонтные комплекты и дроны необходимы. Персональные щиты помогают против ядовитого урона.

5dim-enemies-electric-spitter=[color=#00FFFF]Ярко-голубые плеваки[/color], наносящие цепной урон молнией.\n\n[font=default-bold]Характеристики:[/font]\n• Электрический урон/урон молнией\n• Могут перескакивать между ближними целями\n• Появляются от 30 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nРазнесите турели, чтобы предотвратить цепной урон. Изолированные оборонительные позиции эффективнее плотных скоплений.

5dim-enemies-railgun=[color=#008080]Бирюзовые враги[/color] из Space Age с сопротивлением рельсотрону.\n\n[font=default-bold]Доступны:[/font]\n• Рельсотронные кусаки\n• Рельсотронные плеваки\n• Рельсотронные черви\n\n[font=default-bold]Характеристики:[/font]\n• Высокое сопротивление рельсотронному/бронебойному урону\n• Появляются от 20 % до 100 % эволюции\n\n[font=default-bold]Стратегия:[/font]\nИспользуйте обычное оружие. Рельсотроны и бронебойные патроны менее эффективны.

5dim-enemies-bosses=[color=#6600CC]Враги-боссы[/color] — это огромные, мощные варианты каждого типа врага.\n\n[font=default-bold]Множители босса:[/font]\n• 2x здоровья\n• 2x урона\n• 2x масштаб (визуально крупнее)\n• На 40 % медленнее передвижение\n\n[font=default-bold]Условия появления:[/font]\n• Начинают появляться при 90 % эволюции\n• Максимальная частота появления при 100 % эволюции\n• У всех типов врагов есть варианты-боссы\n\n[font=default-bold]Стратегия:[/font]\nБоссы требуют сосредоточенной огневой мощи. Артиллерия, ракеты и сосредоточенный огонь турелей необходимы. Они медлительны — используйте это в свою пользу!

