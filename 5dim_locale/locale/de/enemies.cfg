[tips-and-tricks-item-description]
5dim-enemies-intro=5Dim-Gegner überarbeitet das Gegnersystem vollständig mit spezialisierten Gegnertypen, einem 10-stufigen Progressionssystem und Boss-Gegnern.\n\nJeder Gegnertyp hat einzigartige Eigenschaften, Resistenzen und Verhaltensweisen, die unterschiedliche Strategien zum Besiegen erfordern. Lerne jeden Typ kennen, um deine Verteidigung entsprechend vorzubereiten.

5dim-enemies-tiers=Gegner in 5Dim erscheinen nun in 10 Stufen (MK1–MK10) plus mächtigen Boss-Varianten.\n\n[font=default-bold]Stufen-Progression:[/font]\n• Stufen skalieren mit dem Evolutionsfaktor\n• Höhere Stufen haben mehr Leben, Schaden und Resistenzen\n• Auf jeder Evolutionsstufe sind 3 Stufen aktiv\n• Jeder Typ hat unterschiedliche Evolutionsbereiche\n\n[font=default-bold]Boss-Gegner:[/font]\n• Erscheinen bei hoher Evolution (90 %+)\n• 2-facher Leben- und Schadensmultiplikator\n• 2-fache Größe (optisch größer)\n• Langsamer, aber weitaus gefährlicher

5dim-enemies-full-battle=Beobachte, wie alle Gegnertypen in einem kombinierten Angriff gegen eine befestigte Verteidigung zusammenarbeiten!\n\n[font=default-bold]Gegner in dieser Schlacht:[/font]\n• Normale, Laser-, physische und Aufprall-Beißer\n• Brutmutter (erzeugt beim Tod Nachkommen)\n• Schwarm-Beißer (viele kleine, schnelle Gegner)\n• Regenerator- und Berserker-Beißer\n• Flammen-, Raketen-, Gift- und Elektro-Speier\n\n[font=default-bold]Verteidigungsaufbau:[/font]\n• Geschütztürme (Frontlinie)\n• Laser-Geschütztürme (hoher Schaden)\n• Flammenwerfer-Geschützturm (Flächenschaden)\n• Steinmauern (Schutz)

5dim-enemies-normal-biter=Standard-Beißer ähnlich den Vanilla-Gegnern.\n\n[font=default-bold]Eigenschaften:[/font]\n• Keine besonderen Resistenzen\n• Ausgewogene Werte über alle Stufen\n• Erscheinen von 0 % bis 80 % Evolution\n\n[font=default-bold]Strategie:[/font]\nJeder Waffentyp ist wirksam. Gut zum Testen defensiver Aufbauten.

5dim-enemies-laser-biter=[color=#4444FF]Blau gefärbte Beißer[/color] mit hoher Laser-Resistenz.\n\n[font=default-bold]Eigenschaften:[/font]\n• 85 %+ Laserschaden-Resistenz\n• Normale physische Verwundbarkeit\n• Erscheinen von 10 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nVerwende Geschütztürme, Flammenwerfer oder Artillerie. Laser-Geschütztürme sind gegen sie nahezu nutzlos.

5dim-enemies-physical-biter=[color=#AAAAAA]Grau-silberne gepanzerte Beißer[/color] mit hoher Kugelresistenz.\n\n[font=default-bold]Eigenschaften:[/font]\n• 85 %+ physische Schadensresistenz\n• Hohe Schadensreduktion (verringert Schaden flach)\n• Erscheinen von 10 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nVerwende Laser-Geschütztürme, Flammenwerfer oder Sprengstoff. Geschütztürme verursachen nur minimalen Schaden.

5dim-enemies-impact-biter=[color=#8B4513]Dunkelbraune schwere Beißer[/color], die Aufprallschaden verursachen.\n\n[font=default-bold]Eigenschaften:[/font]\n• 30 % mehr Leben als normal\n• 50 % mehr Schaden\n• 15 % langsamere Bewegung\n• Resistent gegen Aufprallschaden\n• Erscheinen von 10 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nSie sind langsamer, daher ist Kiting wirksam. Verwende Langstreckenwaffen, um ihre Zahl zu dezimieren, bevor sie deine Mauern erreichen.

5dim-enemies-broodmother-biter=[color=#FF00FF]Magenta-/rosafarbene Beißer[/color], die beim Töten Nachkommen erzeugen.\n\n[font=default-bold]Eigenschaften:[/font]\n• 50 % mehr Leben (zäh)\n• 30 % langsamere Bewegung\n• 20 % weniger Schaden\n• [color=red]Beim Tod: 50 % Chance, einen Beißer niedrigerer Stufe zu erzeugen[/color]\n• Erscheinen von 25 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nVerwende Waffen mit hohem Schaden, um sie wenn möglich mit einem Schuss zu töten. Flächenwaffen können die erzeugten Nachkommen bewältigen. Flammenwerfer sind hervorragend, da sie sowohl die Brutmutter als auch ihre Nachkommen schädigen.

5dim-enemies-swarm-biter=[color=#FFD700]Kleine goldene/sandfarbene Beißer[/color], die in großer Zahl angreifen.\n\n[font=default-bold]Eigenschaften:[/font]\n• 75 % weniger Leben (sehr zerbrechlich)\n• 50 % weniger Schaden\n• 50 % schnellere Bewegung\n• 70 % der normalen Größe (kleiner)\n• [color=cyan]Nester produzieren 2-fach Einheiten bei 2-facher Geschwindigkeit[/color]\n• Erscheinen von 10 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nFlächenwaffen glänzen hier. Flammenwerfer, Raketen und Granaten können ganze Schwärme auslöschen. Einzelzielwaffen werden überwältigt.

5dim-enemies-regenerator-biter=[color=#00FF00]Hellgrüne Beißer[/color], die sich extrem schnell heilen.\n\n[font=default-bold]Eigenschaften:[/font]\n• 25 % weniger Leben\n• [color=cyan]5-fach schnellere Heilungsrate[/color]\n• [color=red]Schwach gegen Feuer (-25 % Resistenz)[/color]\n• Erscheinen von 20 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nKonzentriere das Feuer, um sie schnell zu töten, oder nutze Feuerschaden, um ihre Schwäche auszunutzen. Lässt du sie sich zurückziehen, kehren sie fast augenblicklich mit vollem Leben zurück.

5dim-enemies-berserker-biter=[color=#CC0000]Blutrote Beißer[/color], die Glaskanonen sind.\n\n[font=default-bold]Eigenschaften:[/font]\n• 50 % weniger Leben\n• [color=red]2-facher Schaden (sehr gefährlich!)[/color]\n• 30 % schnellere Bewegung\n• [color=cyan]Können sich überhaupt nicht heilen[/color]\n• Erleiden 10 % zusätzlichen physischen Schaden\n• Erscheinen von 25 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nTöte sie, bevor sie deine Mauern erreichen! Hoher Stoßschaden ist unerlässlich. Sie verursachen verheerenden Schaden, sterben aber schnell. Mauern sind entscheidend, um sie zu verlangsamen.

5dim-enemies-tank=[color=#808000]Militärisch-olivgrüne Gegner[/color], die allen Schadenstypen gleichermaßen widerstehen.\n\n[font=default-bold]Verfügbar:[/font]\n• Tank-Beißer\n• Tank-Speier\n• Tank-Würmer\n\n[font=default-bold]Eigenschaften:[/font]\n• [color=cyan]50 % Resistenz gegen ALLE Schadenstypen[/color] (physisch, Laser, Feuer, Gift, Elektro, Explosion, Säure, Aufprall)\n• [color=cyan]2-faches Leben[/color] (extrem zäh)\n• [color=red]65 % weniger Schaden[/color]\n• 20 % langsamere Bewegung\n• Keine flache Schadensreduktion, nur prozentual\n• Erscheinen von 15 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nKein einzelner Waffentyp ist besonders wirksam oder schwach gegen sie. Verwende deine Waffen mit dem höchsten DPS. Ihr geringer Schaden bedeutet, dass sie nicht unmittelbar bedrohlich sind, aber sie können deine Verteidigung ablenken, während gefährlichere Gegner näher kommen.

5dim-enemies-fire-spitter=[color=#FF6600]Orangefarbene/feurige Speier[/color], die Feuergeschosse verschießen.\n\n[font=default-bold]Eigenschaften:[/font]\n• 25 % weniger Leben als normale Speier\n• Feuerschaden über Zeit beim Aufprall\n• Erzeugen brennenden Boden\n• Erscheinen von 20 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nIhre Geschosse können deine Basis in Brand setzen. Verwende Stein- oder Betonwege rund um Geschütztürme. Feuerresistente Ausrüstung hilft bei der persönlichen Verteidigung.

5dim-enemies-rocket-spitter=[color=#FFFF66]Blassgelbe Speier[/color], die explosive Raketen verschießen.\n\n[font=default-bold]Eigenschaften:[/font]\n• 25 % weniger Leben als normale Speier\n• Explosiver Spritzschaden\n• Flächenschaden beim Aufprall\n• Erscheinen von 30 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nVerteile deine Verteidigung, um Spritzschaden zu minimieren. Mauern helfen, Raketentreffer zu absorbieren. Vorrangige Ziele zum Anvisieren.

5dim-enemies-suicide-spitter=[color=#9900CC]Dunkelviolette Speier[/color], die beim Tod explodieren.\n\n[font=default-bold]Eigenschaften:[/font]\n• 50 % weniger Leben\n• 50 % schnellere Bewegung\n• [color=red]5-facher Schaden bei der Explosion![/color]\n• Erscheinen von 30 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nTöte sie aus der Ferne, bevor sie deine Basis erreichen. Ihre Explosionen können Geschütztürme und Mauern zerstören. Lass sie niemals nah an kritische Infrastruktur herankommen.

5dim-enemies-poison-spitter=[color=#006600]Dunkelgrüne Speier[/color], die Giftschaden verursachen.\n\n[font=default-bold]Eigenschaften:[/font]\n• Giftschaden über Zeit\n• Stapelnder Gifteffekt\n• Erscheinen von 20 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nGift kann deine Strukturen mit der Zeit zermürben. Reparaturpakete und Roboter sind unerlässlich. Persönliche Schilde helfen gegen Giftschaden.

5dim-enemies-electric-spitter=[color=#00FFFF]Hell-cyanfarbene Speier[/color], die Kettenblitzschaden verursachen.\n\n[font=default-bold]Eigenschaften:[/font]\n• Elektro-/Blitzschaden\n• Können zwischen nahen Zielen überspringen\n• Erscheinen von 30 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nVerteile deine Geschütztürme, um Kettenschaden zu vermeiden. Isolierte Verteidigungsstellungen sind wirksamer als dichte Ansammlungen.

5dim-enemies-railgun=[color=#008080]Türkisfarbene Gegner[/color] aus Space Age mit Schienenkanonen-Resistenz.\n\n[font=default-bold]Verfügbar:[/font]\n• Schienenkanonen-Beißer\n• Schienenkanonen-Speier\n• Schienenkanonen-Würmer\n\n[font=default-bold]Eigenschaften:[/font]\n• Hohe Resistenz gegen Schienenkanonen-/panzerbrechenden Schaden\n• Erscheinen von 20 % bis 100 % Evolution\n\n[font=default-bold]Strategie:[/font]\nVerwende konventionelle Waffen. Schienenkanonen und panzerbrechende Munition sind weniger wirksam.

5dim-enemies-bosses=[color=#6600CC]Boss-Gegner[/color] sind massive, mächtige Varianten jedes Gegnertyps.\n\n[font=default-bold]Boss-Multiplikatoren:[/font]\n• 2-faches Leben\n• 2-facher Schaden\n• 2-fache Größe (optisch größer)\n• 40 % langsamere Bewegung\n\n[font=default-bold]Erscheinungsbedingungen:[/font]\n• Beginnen bei 90 % Evolution zu erscheinen\n• Maximale Erscheinungsrate bei 100 % Evolution\n• Alle Gegnertypen haben Boss-Varianten\n\n[font=default-bold]Strategie:[/font]\nBosse erfordern konzentrierte Feuerkraft. Artillerie, Raketen und gebündeltes Geschützturmfeuer sind unerlässlich. Sie sind langsam – nutze das zu deinem Vorteil!

