5d-sniper-magazine=Munitions de précision de base conçues pour le fusil de précision et les tourelles de précision.
5d-piercing-sniper-magazine=Munitions de précision perforantes pour des dégâts soutenus améliorés.
5d-tungsten-sniper-magazine=Munitions de précision à noyau de tungstène dense qui se situent entre le perforant et la puissance d'arrêt de l'uranium.
5d-uranium-sniper-magazine=Munitions de précision haut de gamme à munitions d'uranium pour un impact maximal.
5d-uranium-tungsten-sniper-magazine=Munitions de précision de fin de partie qui renforcent les munitions d'uranium avec du tungstène pour les coups les plus puissants de la gamme.
