[mod-setting-description]
5d-space-age-materials=Wenn aktiviert und das Space-Age-DLC installiert ist, erfordert die Progression hoher Stufen (5–10) sowohl planetare Materialien in Rezepten als auch planetare Wissenschaftspakete in Technologien, gemäß der Space-Age-Progression jedes Moduls.
5d-icon-tier-overlay=Fügt das Stufennummer-Abzeichen zu Objekt-, Rezept-, Technologie- und Prototypsymbolen hinzu, die den gemeinsamen 5Dim-Abzeichenhelfer verwenden.
5d-icon-tier-overlay-black-background=Zeigt das Stufen-Abzeichen des Symbols mit dem aktuellen schwarzen Hintergrund. Deaktiviere es, um nur die Stufennummer zu behalten.
5d-entity-tier-overlay=Zeichnet zur Laufzeit die Stufennummer über unterstützten platzierten Entitäten.
5d-entity-tier-overlay-black-background=Zeigt das Stufen-Overlay der Entität mit einem schwarzen Hintergrund hinter der Nummer. Deaktiviere es, um nur die Stufennummer zu behalten.
5d-machine-work-factor=Globaler Progressionsfaktor von Stufe zu Stufe für die Arbeitsleistung von Maschinen wie Fertigungsgeschwindigkeit, Abbaugeschwindigkeit, Forschungsgeschwindigkeit, Pumpgeschwindigkeit oder ähnliche Durchsatzwerte. Start-Einstellung. Standard: 1.45
5d-machine-energy-factor=Globaler Progressionsfaktor von Stufe zu Stufe für den Energieverbrauch von Maschinen. Höhere Werte machen spätere Stufen energiehungriger, um die Skalierung von Megabasen zu unterstützen. Start-Einstellung. Standard: 1.75
5d-machine-recipe-factor=Globaler Progressionsfaktor von Stufe zu Stufe für die Rezept-Deltas beim Aufrüsten von Maschinen. Interne Seltenheitsgewichte verhindern, dass exotische Zutaten so stark skalieren wie gewöhnliche Baumaterialien. Start-Einstellung. Standard: 1.25
5d-machine-tech-factor=Globaler Progressionsfaktor von Stufe zu Stufe für die Forschungskosten der Maschinentechnologien. Die Forschungskosten werden auf glattere Werte gerundet. Start-Einstellung. Standard: 1.3
5d-machine-t10-next-tier-work=Wenn aktiviert, nutzt die letzte Stufe unterstützter Maschinenfamilien den Arbeitswert der nächsten theoretischen Stufe und macht T10 zu einer Abschluss-Aufrüstung, ohne ihre Basis-Energiestufe anzuheben. Start-Einstellung.
5d-machine-t10-extra-module-slots=Zusätzliche Modulplätze, die der letzten Stufe unterstützter Maschinenfamilien als Abschlussbonus hinzugefügt werden. Start-Einstellung. Standard: 2
5d-crafting-time-multiplier=Multiplikator für alle Fertigungszeiten (Standard: 1.0)
5d-recipe-cost-multiplier=Globaler Multiplikator für die Zutatenkosten von Rezepten. Gilt für die alte Zutatenskalierung und die Materialmengen von Space Age. Maschinenfamilien, die eine Rezeptprogression pro Stufe nutzen, werden stattdessen vom Maschinen-Rezeptprogressionsfaktor gesteuert. Start-Einstellung. (Standard: 1.0)
5d-spoil-time-multiplier=Multiplikator für die Verfallszeit aller verderblichen Objekte. Werte über 1 lassen Objekte länger halten; Werte unter 1 lassen sie schneller verderben. Nur sichtbar, wenn Space Age installiert ist. (Standard: 1.0)
5d-change-inventory=Anzahl der Inventarplätze des Spielers (Standard: 60)
5d-change-stack=Multiplikator für die Stapelgrößen von Objekten
5d-long-reach=Reichweite zum Bauen und Öffnen von Inventaren. Für die Interaktion mit dem gesamten Bildschirm: 125 (Standard: 6)
5d-long-mine=Erweitert die Abbaureichweite deines Spielers (Standard: 6)
5d-mining-speed=Multiplikator für die Abbaugeschwindigkeit des Spielers
5d-light-radius=Radius des Lichts um den Spieler (Standard: 25)
5d-ores=Macht alle Ressourcenvorkommen unendlich
5d-yield=Unendliche Erze mit vollem Ertrag (100 % Minimum)
5d-tree=Verkleinert die Kollisionsbox von Bäumen für leichtere Fortbewegung
5d-item-start=Wähle die Startobjekte beim Erstellen einer neuen Karte
5d-equip-start=Wähle die Startausrüstung beim Erstellen einer neuen Karte
5d-train-tech=Schaltet Zug-Technologien beim Spielstart frei
5d-robot-tech=Schaltet Roboter-Technologien beim Spielstart frei
5d-hp=Maximale Lebenspunkte des Spielers (Standard: 250)
5d-healing=Lebensregeneration pro Tick (Standard: 0.15)
5d-stack-artillery-bullets=Erlaubt das Stapeln von Artilleriegeschossen auf bis zu 5
5d-special-turrets=Aktiviert Gift-, Säure-, Mörser-, Roboterwerfer- und Leucht-Geschütztürme samt ihren Rezepten und Technologien.
5d-special-mines=Aktiviert Gift- und Säureminen samt ihren Rezepten und Technologien.
5d-bicho-spawner-hp=Multiplikator für das Leben der Gegnernester
5d-bicho-hp=Multiplikator für das Leben der Gegnereinheiten
5d-bicho-healing=Multiplikator für die Heilung der Gegner pro Tick
5d-suicide=Aktiviert Selbstmord-Beißer, die bei Kontakt explodieren
5d-exp=Aktiviert experimentelle Gegnertypen
5d-worm=Aktiviert riesige und experimentelle Würmer
5d-storage=Aktiviert endlose Forschung für die Frachtgröße von Robotern
5d-stack=Aktiviert endlose Forschung für die Kapazität des Stapelgreifarms
5d-speed=Aktiviert endlose Forschung für den Forschungsgeschwindigkeitsbonus
5d-speed-gun-turret=Aktiviert endlose Forschung für Waffen- und Geschützturmgeschwindigkeit
5d-braking=Aktiviert endlose Forschung für die Bremskraft von Zügen
5d-grid=Aktiviert Ausrüstungsraster bei Fahrzeugen
5d-grid-override=Überschreibt die Ausrüstungsraster aller Fahrzeuge (benötigt aktivierte Fahrzeugraster)
